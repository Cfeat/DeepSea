<style>
:root{--paper:#f7f1df;--muted:rgba(235,247,238,.62);--faint:rgba(235,247,238,.38);--mint:#a9f5df;--line:rgba(226,255,246,.23);--glass:rgba(230,255,248,.10);--shadow:0 26px 80px rgba(0,10,16,.5);--serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;--sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#03151e;color:var(--paper);font-family:var(--sans)}button{font:inherit;color:inherit;border:0;background:none;padding:0}a{color:inherit;text-decoration:none}canvas{display:block}::selection{background:rgba(151,255,228,.32);color:#fff}:focus-visible{outline:2px solid #c9ffed;outline-offset:3px}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none}
.vignette,.grain,.flash{position:fixed;inset:0;pointer-events:none}.vignette{z-index:1;background:radial-gradient(115% 82% at 50% 45%,transparent 45%,rgba(0,8,13,.18) 78%,rgba(0,7,12,.48) 100%),linear-gradient(180deg,rgba(0,10,15,.24),transparent 23% 70%,rgba(0,8,12,.4))}.grain{z-index:2;opacity:.05;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/></svg>")}.flash{z-index:3;background:#001017;opacity:0;transition:opacity .24s ease}

.embed-close{display:none;position:fixed;top:24px;left:26px;z-index:12;align-items:center;gap:8px;padding:9px 13px;border:1px solid rgba(223,255,247,.28);border-radius:99px;background:rgba(1,19,27,.55);backdrop-filter:blur(14px);font-size:9px;letter-spacing:.14em;color:var(--paper);cursor:pointer}body.is-embedded .embed-close{display:flex}.back{position:fixed;top:24px;left:26px;z-index:8;display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(1,20,28,.34);backdrop-filter:blur(14px);font-size:9px;letter-spacing:.14em;color:var(--muted);transition:opacity .3s,transform .3s}.back i{width:18px;height:18px;border:1px solid rgba(206,255,241,.42);border-radius:50%;display:grid;place-items:center;font-style:normal;color:var(--mint);font-size:10px}.back b{font-weight:400;color:var(--paper)}body.is-embedded .back{display:none}

.masthead{position:fixed;top:32px;left:32px;z-index:7;pointer-events:none;text-shadow:0 2px 30px rgba(0,17,24,.35);transition:opacity .4s;margin-top:42px}.masthead .eyebrow{margin:0 0 12px;font-size:9px;letter-spacing:.3em;color:rgba(231,252,243,.62)}.masthead h1{margin:0;font:400 clamp(40px,5vw,72px)/.95 var(--serif);letter-spacing:.06em;color:#fcf7e8}.masthead .lede{max-width:340px;margin:16px 0 0;font-size:11px;line-height:1.95;letter-spacing:.08em;color:rgba(230,248,238,.66)}

.zone-nav{position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:2px;padding:5px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(135deg,rgba(230,255,248,.13),rgba(2,35,47,.34));backdrop-filter:blur(24px) saturate(1.3);box-shadow:0 14px 44px rgba(0,10,16,.28),inset 0 1px 0 rgba(255,255,255,.12);transition:opacity .4s,transform .4s}.zone-nav button{position:relative;min-width:78px;height:50px;padding:6px 10px 5px;border:1px solid transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(241,249,235,.58);cursor:pointer;transition:background .25s,color .25s,border-color .25s}.zone-nav button:hover{background:rgba(203,255,240,.08);color:var(--paper)}.zone-nav button[aria-pressed="true"]{background:rgba(159,252,223,.15);border-color:rgba(181,255,233,.32);color:#eafff8}.zone-nav b{font-weight:400;font-size:10px;letter-spacing:.12em;white-space:nowrap}.zone-nav small{font:7px/1 Georgia,serif;letter-spacing:.08em;color:rgba(218,255,244,.44)}.zone-nav [aria-pressed="true"] small{color:rgba(204,255,240,.74)}.zone-nav .sep{width:1px;height:24px;align-self:center;background:rgba(219,255,243,.12);margin:0 1px}

.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;width:min(1120px,calc(100vw - 56px));padding:13px 15px 11px;border:1px solid rgba(224,255,247,.28);border-radius:20px;background:linear-gradient(132deg,rgba(225,255,247,.14),rgba(3,36,47,.43) 55%,rgba(1,26,37,.58));backdrop-filter:blur(28px) saturate(1.3);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.17);transition:opacity .4s,transform .4s}.dock-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 5px 8px;font-size:8px;letter-spacing:.16em;color:rgba(233,250,240,.58)}.dock-head strong{font-weight:400;color:rgba(248,252,239,.9);letter-spacing:.13em}.dock-head .count{font-size:8px;color:rgba(219,255,244,.45)}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.card{position:relative;height:118px;overflow:hidden;border:1px solid rgba(226,255,247,.18);border-radius:12px;background:linear-gradient(155deg,rgba(185,255,239,.09),rgba(1,29,40,.28));cursor:pointer;text-align:left;transition:transform .25s,border-color .25s,background .25s;touch-action:none;isolation:isolate}.card:hover{transform:translateY(-4px);border-color:rgba(191,255,237,.5);background:linear-gradient(155deg,rgba(197,255,241,.16),rgba(3,43,55,.32))}.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.12),transparent 30% 72%,rgba(143,255,228,.04))}.card canvas{position:absolute;inset:1px 2px 24px;width:calc(100% - 4px);height:calc(100% - 25px);object-fit:cover;filter:drop-shadow(0 5px 9px rgba(0,10,16,.25))}.card .copy{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:5px;padding:7px 9px 6px;background:linear-gradient(transparent,rgba(0,18,27,.82))}.card .copy b{font-size:10.5px;font-weight:400;letter-spacing:.08em;white-space:nowrap;color:#fbf6e6}.card .copy small{font:italic 6.5px/1 Georgia,serif;letter-spacing:.05em;color:rgba(226,255,245,.44);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .num{position:absolute;top:7px;left:8px;z-index:2;font:6.5px/1 Georgia,serif;letter-spacing:.12em;color:rgba(230,255,245,.48)}.card .tag{position:absolute;top:6px;right:6px;z-index:2;padding:3px 5px 2px;border:1px solid rgba(218,255,243,.2);border-radius:99px;background:rgba(2,30,40,.3);font-size:6px;letter-spacing:.12em;color:rgba(222,255,244,.56)}.card.is-new{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.cards.is-single{grid-template-columns:minmax(0,220px);justify-content:center}.cards.is-double{grid-template-columns:repeat(2,minmax(0,220px));justify-content:center}.empty-note{grid-column:1/-1;padding:20px;text-align:center;font-size:10px;letter-spacing:.12em;color:var(--muted)}

.hint{position:fixed;left:50%;bottom:151px;z-index:6;transform:translateX(-50%);margin:0;font-size:8px;letter-spacing:.14em;color:rgba(235,251,240,.42);pointer-events:none;white-space:nowrap;text-shadow:0 2px 16px rgba(0,10,15,.45)}.hint i{font-style:normal;color:rgba(181,255,233,.72)}
.loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#0b3e46,#021018 67%);transition:opacity .8s ease,visibility .8s ease}.loading.done{opacity:0;visibility:hidden;pointer-events:none}.load-copy{text-align:center;color:rgba(246,251,238,.85)}.load-copy span{display:block;margin-bottom:15px;font:7px/1.4 Georgia,serif;letter-spacing:.32em;color:rgba(207,255,242,.48)}.load-copy b{display:block;font:400 clamp(35px,5vw,56px)/1.1 var(--serif);letter-spacing:.16em}.load-copy i{display:block;margin-top:16px;font-style:normal;font-size:9px;letter-spacing:.26em;color:rgba(195,255,237,.42)}
.toast{position:fixed;left:50%;bottom:132px;z-index:20;transform:translate(-50%,8px);padding:9px 15px;border:1px solid rgba(216,255,244,.25);border-radius:99px;background:rgba(1,27,37,.78);backdrop-filter:blur(16px);font-size:9px;letter-spacing:.1em;color:rgba(247,252,240,.9);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}

body.is-embedded .zone-title{right:70px}
@media (max-width:900px){.back{top:14px;left:14px;font-size:8px;padding:7px 10px}.masthead{top:16px;left:16px;margin-top:40px}.masthead h1{font-size:clamp(30px,9vw,48px)}.masthead .lede{display:none}.masthead .eyebrow{font-size:7px;margin-bottom:7px}.zone-title{top:74px;right:16px;width:53vw}.zone-title .kicker{font-size:6.5px;margin-bottom:5px}.zone-title h2{font-size:clamp(28px,8vw,44px)}.zone-title .range{font-size:7px;margin-top:6px}.zone-title p:last-child{display:none}.zone-nav{top:auto;bottom:150px;left:12px;right:12px;transform:none;overflow-x:auto;justify-content:flex-start;gap:1px;padding:4px;border-radius:14px;scrollbar-width:none}.zone-nav::-webkit-scrollbar{display:none}.zone-nav button{min-width:58px;height:41px;padding:4px 6px;gap:2px;flex:0 0 auto}.zone-nav b{font-size:8px;letter-spacing:.04em}.zone-nav small{font-size:5.5px}.zone-nav .sep{height:20px}.dock{bottom:7px;width:calc(100vw - 14px);padding:8px 8px 7px;border-radius:15px}.dock-head{margin:0 3px 6px;font-size:6px;letter-spacing:.08em}.dock-head .count{font-size:6px}.cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.card{height:82px;border-radius:9px}.card canvas{inset:1px 1px 19px;width:calc(100% - 2px);height:calc(100% - 20px)}.card .copy{padding:4px 4px 3px}.card .copy b{font-size:7.5px;letter-spacing:0}.card .copy small{display:none}.card .tag{display:none}.card .num{top:3px;left:3px;font-size:5px}.hint{bottom:135px;font-size:6.5px;letter-spacing:.06em}.toast{bottom:132px;font-size:8px}.cards.is-single{grid-template-columns:minmax(0,78px)}.cards.is-double{grid-template-columns:repeat(2,minmax(0,78px))}}
@media (max-height:550px){.masthead .lede,.zone-title p:last-child{display:none}.masthead{margin-top:7px}.zone-title{top:15px;right:15px}.zone-nav{top:14px;bottom:auto;left:auto;right:180px;transform:none;max-width:46vw}.dock{bottom:5px;padding:5px}.card{height:66px}.hint{display:none}}
</style>

<body>
<canvas id="scene" aria-label="海层剧场：每个深度层的可交互生物场景"></canvas>
<div class="vignette" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><div class="flash" id="flash" aria-hidden="true"></div>

<button class="embed-close" id="embed-close" type="button">← 退出剧场</button>
<a class="back" href="./#journey"><i>≋</i><b>深海</b> / 返回深度轴</a>

<header class="masthead">
  <p class="eyebrow">DEPTH THEATRE / 05 SCENES</p>
  <h1>海层剧场</h1>
  <p class="lede">把深度轴变成五个可以停留的场景。每一层都有自己的光、颗粒和居民；低多边形模型用于场景辨识，点击卡片回到原来的生物百科。</p>
</header>

<div class="zone-title" id="zone-title" aria-live="polite">
  <p class="kicker">01 / SUNLIGHT ZONE</p>
  <h2>透光层</h2>
  <p class="range">0–200 m · 阳光</p>
  <p>阳光还在这里。浮游植物把光变成食物，大型动物从海面游过。</p>
</div>

<nav class="zone-nav" id="zone-nav" aria-label="海层场景切换"></nav>

  <div class="dock-head"><span><strong id="dock-title">本层居民</strong> · 3D 低多边形场景模型</span><span class="count" id="dock-count">5 种 / 本层</span></div>
  <div class="cards" id="cards"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="loading" id="loading"><div class="load-copy"><span>0 – 11,000 M · DEPTH THEATRE</span><b>海层剧场</b><i>正在布置五个海层</i></div></div>

<script id="bg-frag" type="x-shader/x-fragment">
precision highp float;
uniform vec3 uTop;
uniform vec3 uBottom;
uniform vec3 uGlow;
uniform float uTime;
uniform float uRays;
uniform float uCaustic;
varying vec2 vUv;

float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
void main(){
  float y = vUv.y;
  vec3 col = mix(uBottom, uTop, smoothstep(0.0, 1.0, pow(y, 0.86)));
  float halo = exp(-pow(distance(vUv, vec2(0.5, 1.03)) * 2.1, 2.0));
  col += uGlow * halo * 0.34;
  float rays = 0.0;
  for (int i = 0; i < 5; i++){
    float off = float(i) * 0.19;
    float line = sin((vUv.x + off) * 28.0 + uTime * 0.10 + float(i) * 2.1);
    rays += smoothstep(0.86, 1.0, line) * (0.3 + 0.7 * (1.0 - y));
  }
  col += uGlow * rays * uRays * 0.055 * smoothstep(0.0, 0.18, y);
  float c1 = sin(vUv.x * 34.0 + sin(vUv.y * 18.0 + uTime * 0.30) * 2.2 + uTime * 0.22);
  float c2 = sin(vUv.y * 27.0 + sin(vUv.x * 16.0 - uTime * 0.25) * 2.0 - uTime * 0.18);
  float caustic = pow(1.0 - clamp(abs(c1 + c2) * 0.46, 0.0, 1.0), 9.0);
  col += uGlow * caustic * uCaustic * (0.2 + 0.8 * (1.0 - y)) * 0.20;
  col += (hash21(vUv * 520.0 + floor(uTime * 5.0)) - 0.5) * 0.012;
  col *= 1.0 - 0.26 * pow(clamp(length(vUv - 0.5) * 1.25, 0.0, 1.0), 2.0);
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE){document.write('<script src="./vendor/three.min.js"><\/script>')}</script>
<script>
(() => {
"use strict";
const T=window.THREE;
const canvas=document.getElementById("scene");
const loading=document.getElementById("loading");
const nav=document.getElementById("zone-nav");
const cardsEl=document.getElementById("cards");
const titleEl=document.getElementById("zone-title");
const countEl=document.getElementById("dock-count");
const flash=document.getElementById("flash");
const toastEl=document.getElementById("toast");
const embedded=window.self!==window.top;
if(embedded) document.body.classList.add("is-embedded");
window.addEventListener("keydown",event=>{if(event.key==="Escape"&&embedded){event.preventDefault();window.parent.postMessage({type:"deepsea:close-scenes"},"*");}});
const embedClose=document.getElementById("embed-close");
if(embedClose)embedClose.addEventListener("click",()=>window.parent.postMessage({type:"deepsea:close-scenes"},"*"));
if(!T){loading.innerHTML='<div class="load-copy"><b>海层剧场</b><i>Three.js 未能载入</i></div>';return;}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TAU=Math.PI*2;
const rr=(a,b)=>a+(b-a)*Math.random();
let toastTimer=0;
function toast(message){toastEl.textContent=message;toastEl.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2400);}
function postCreature(id){
  if(embedded){ window.parent.postMessage({type:"deepsea:open-creature",id:id},"*"); }
  else { window.location.href="./?creature="+encodeURIComponent(id)+"#journey"; }
}

const renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,alpha:false,powerPreference:"high-performance",stencil:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
renderer.setSize(innerWidth,innerHeight,false);
renderer.autoClear=false;
renderer.setClearColor(0x020b12,1);
renderer.outputEncoding=T.LinearEncoding;
renderer.toneMapping=T.NoToneMapping;

const scene=new T.Scene();
const camera=new T.PerspectiveCamera(43,innerWidth/innerHeight,0.1,80);
let cameraBaseZ=15.5,cameraTargetX=0;
function layoutCamera(){const aspect=innerWidth/innerHeight;if(aspect<.9){cameraBaseZ=40;cameraTargetX=.55;}else{cameraBaseZ=15.5;cameraTargetX=0;}camera.position.z=cameraBaseZ;}
layoutCamera();
camera.position.set(cameraTargetX,1.3,cameraBaseZ);
camera.lookAt(cameraTargetX,0,0);
scene.add(new T.AmbientLight(0xd8fff5,0.58));
const key=new T.DirectionalLight(0xfff0cf,0.80); key.position.set(-8,12,10); scene.add(key);
const rim=new T.DirectionalLight(0x64c8d4,0.34); rim.position.set(8,-4,6); scene.add(rim);
scene.fog=new T.FogExp2(0x073d4d,0.015);

const bgScene=new T.Scene();
const bgCamera=new T.OrthographicCamera(-1,1,1,-1,0,1);
const bgUniforms={uTop:{value:new T.Color(0x1b9fa5)},uBottom:{value:new T.Color(0x053f57)},uGlow:{value:new T.Color(0xb9ffe8)},uTime:{value:0},uRays:{value:1},uCaustic:{value:1}};
const bgMat=new T.ShaderMaterial({uniforms:bgUniforms,vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',fragmentShader:document.getElementById("bg-frag").textContent.trim(),depthTest:false,depthWrite:false});
const bgMesh=new T.Mesh(new T.PlaneGeometry(2,2),bgMat);bgMesh.frustumCulled=false;bgScene.add(bgMesh);

const spriteCanvas=document.createElement("canvas");spriteCanvas.width=64;spriteCanvas.height=64;
const sctx=spriteCanvas.getContext("2d");const grad=sctx.createRadialGradient(32,32,1,32,32,31);grad.addColorStop(0,"rgba(255,255,255,.95)");grad.addColorStop(.35,"rgba(255,255,255,.5)");grad.addColorStop(1,"rgba(255,255,255,0)");sctx.fillStyle=grad;sctx.fillRect(0,0,64,64);
const sprite=new T.CanvasTexture(spriteCanvas);sprite.minFilter=T.LinearFilter;

function makePoints(count,color,size,opacity,blending){
  const arr=new Float32Array(count*3);
  for(let i=0;i<count;i++){arr[i*3]=rr(-17,17);arr[i*3+1]=rr(-9,9);arr[i*3+2]=rr(-12,5);}
  const g=new T.BufferGeometry();g.setAttribute("position",new T.BufferAttribute(arr,3));
  const m=new T.PointsMaterial({color:color,size:size,map:sprite,transparent:true,opacity:opacity,depthWrite:false,blending:blending||T.NormalBlending,sizeAttenuation:true});
  const points=new T.Points(g,m);points.frustumCulled=false;scene.add(points);return points;
}
const snow=makePoints(520,0xd9fff3,0.055,0.55,T.NormalBlending);
const glow=makePoints(160,0x72f6df,0.12,0.7,T.AdditiveBlending);

const zones=[
  {id:"epipelagic",name:"透光层",en:"SUNLIGHT ZONE",range:"0–200 m",depth:"0–200 m",intro:"阳光还在这里。浮游植物把光变成食物，大型动物从海面游过。",palette:{top:0x0e8490,bottom:0x032f47,glow:0x9dffe4,fog:0x073f51,rays:.62,caustic:.45,snow:0xe8fff8,snowSize:.055,snowOpacity:.44},creatures:[
    {id:"manta-ray",name:"大洋蝠鲼",latin:"Mobula birostris",tag:"MANTA",builder:"manta",pos:[-4.8,1.6,0],rot:[0.92,0.18,0.05],scale:1.12,phase:0.2,bob:.18,cardRot:[.72,.2,0]},
    {id:"whale-shark",name:"鲸鲨",latin:"Rhincodon typus",tag:"WHALE SHARK",builder:"whaleshark",pos:[1.0,1.8,-2.2],rot:[0.05,-.25,.03],scale:.64,phase:1.3,bob:.14,cardRot:[.02,.22,0]},

const sphereGeo=new T.SphereGeometry(1,14,10);
const lowSphereGeo=new T.SphereGeometry(1,9,6);
function M(color,opts){return new T.MeshStandardMaterial(Object.assign({color:color,roughness:.72,metalness:.03,flatShading:true},opts||{}));}
function B(color,opts){return new T.MeshBasicMaterial(Object.assign({color:color},opts||{}));}
function add(parent,geo,mat,x,y,z,sx,sy,sz,rx,ry,rz){
  const m=new T.Mesh(geo,mat);
  m.position.set(x||0,y||0,z||0);
  m.scale.set(sx==null?1:sx,sy==null?1:sy,sz==null?1:sz);
  m.rotation.set(rx||0,ry||0,rz||0);
  parent.add(m);return m;
}
function ell(parent,color,sx,sy,sz,x,y,z,opts){
  const m=add(parent,sphereGeo,M(color,opts),x,y,z,sx,sy,sz);
  return m;
}
function low(parent,color,sx,sy,sz,x,y,z,opts){
  return add(parent,lowSphereGeo,M(color,opts),x,y,z,sx,sy,sz);
}
function cyl(parent,color,r1,r2,h,x,y,z,rx,ry,rz,opts){
  return add(parent,new T.CylinderGeometry(r1,r2,h,8,1),M(color,opts),x,y,z,1,1,1,rx,ry,rz);
}
function cone(parent,color,radius,h,x,y,z,rx,ry,rz,opts){
  return add(parent,new T.ConeGeometry(radius,h,8,1),M(color,opts),x,y,z,1,1,1,rx,ry,rz);
}
function fin(parent,color,pts,pos,rot,scale,opts){
  const shape=new T.Shape();
  pts.forEach((p,i)=>{if(i===0)shape.moveTo(p[0],p[1]);else shape.lineTo(p[0],p[1]);});
  shape.closePath();
  const geo=new T.ShapeGeometry(shape);
  const mat=M(color,Object.assign({side:T.DoubleSide},opts||{}));
  return add(parent,geo,mat,pos[0],pos[1],pos[2],scale&&scale[0]||1,scale&&scale[1]||1,scale&&scale[2]||1,rot&&rot[0]||0,rot&&rot[1]||0,rot&&rot[2]||0);
}
function tube(parent,color,points,radius,opts){
  const curve=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(p[0],p[1],p[2])));
  return add(parent,new T.TubeGeometry(curve,32,radius,6,false),M(color,opts),0,0,0);
}
function eyePair(parent,x,y,z,r,color){
  const dark=color||0x071114;
  [-1,1].forEach(side=>{
    add(parent,sphereGeo,M(dark,{roughness:.35,metalness:.2}),x,y,z+side*(r*.65)+.03,r,r*.75,r*.5);
    add(parent,sphereGeo,B(0xe9fff7),x+r*.13,y+r*.1,z+side*(r*.65)+r*.48,r*.28,r*.28,r*.15);
  });
}
function teeth(parent,count,startX,y,z,size,dir){
  for(let i=0;i<count;i++){
    const x=startX+i*.12;
    cone(parent,0xf1e7d2,size*.09,size,x,y,z,dir?Math.PI:0,0,0);
  }
}

  eyePair(g,.42,.38,.38,.12,0x050c0d);
  fin(g,0x3a2a26,[[0,0],[-.2,.6],[-.5,.5],[-.15,.05]],[-.45,.6,0],[0,0,0],[1,1,1]);
  fin(g,0x3a2a26,[[0,0],[-.45,-.3],[-.3,.3],[-.02,.2]],[-.78,-.05,0],[0,0,0],[1.2,1.1,1]);
  const lure=new T.Group();
  tube(g,0x5f4938,[[.1,.6,0],[.05,1.0,.05],[.4,1.28,.08],[.75,1.1,.1]],.025);
  const glowBall=add(g,sphereGeo,B(0x9dffe9),.78,1.08,.1,.14,.14,.14);
  g.userData.lure=glowBall;
  for(let i=0;i<3;i++)add(g,sphereGeo,B(0x78e9d2),.8+i*.11,1.16-i*.08,.12,.035,.035,.035);
  return g;
}

function buildPelicanEel(){
  const g=new T.Group();
  ell(g,0x2c3138,.56,.45,.4,.9,.1,0,{roughness:.8});
  add(g,sphereGeo,M(0x292e35),1.55,-.18,0,1.05,.45,.5);
  eyePair(g,1.2,.25,.3,.08,0x04080c);
  add(g,new T.TorusGeometry(.28,.02,4,16,Math.PI*.8),M(0x13181b),1.95,.12,.02);
  const pts=[];for(let i=0;i<=16;i++){const t=i/16;pts.push([.8-t*4.6,Math.sin(t*6)*.1,.02]);}
  tube(g,0x2b3037,pts,.075);
  fin(g,0x2b3037,[[0,0],[-.2,.3],[-.32,-.1]],[-3.8,0,0],[0,0,0],[1,1,1]);
  for(let i=0;i<5;i++)add(g,sphereGeo,B(0x99f4e4),.4-i*.5,-.1,.3,.025,.025,.025);
  return g;
}

function buildFangtooth(){
  const g=new T.Group();
  ell(g,0x302721,.72,.63,.58,0,0,0,{roughness:.85});
  ell(g,0x46352c,.55,.2,.45,.25,-.22,0);
  eyePair(g,.35,.25,.35,.19,0x030708);
  teeth(g,5,.2,.05,.24,.3,false);
  teeth(g,4,.26,-.28,.24,.26,true);
  fin(g,0x332923,[[0,0],[-.2,.48],[-.42,.35],[-.1,.02]],[-.3,.5,0],[0,0,0],[1,1,1]);
  fin(g,0x332923,[[0,0],[-.4,-.25],[-.22,.25],[-.02,.18]],[-.62,-.04,0],[0,0,0],[1.1,1,1]);
  for(let i=0;i<6;i++)cone(g,0x41332b,.035,.18,-.35+i*.1,.62,0,0,0,0);
  return g;
}

function buildDumbo(){
  const g=new T.Group();
  ell(g,0xc17d84,.78,.65,.62,0,.38,0,{roughness:.7});
  ell(g,0xe0a3a1,.38,.26,.36,0,.9,0);
  eyePair(g,.42,.55,.42,.12,0x120a0e);
  [-1,1].forEach(s=>{
    fin(g,0xc98d91,[[0,0],[.55,.34],[.5,-.03],[.1,-.15]],[s*.6,.82,0],[0,0,s*.2],[1.1,1,1],{roughness:.75});
  });
  for(let i=0;i<8;i++){
    const a=(i/8)*TAU;
    tube(g,0xd39899,[[Math.cos(a)*.38,-.05,Math.sin(a)*.38],[Math.cos(a)*.65,-.7,Math.sin(a)*.65],[Math.cos(a)*.35,-1.1,Math.sin(a)*.35]],.045);
  }
  add(g,sphereGeo,B(0x9dffe6),0,.16,.6,.035,.035,.035);
  return g;
}

function buildIsopod(){
  const g=new T.Group();
  const shell=M(0xb6a486,{roughness:.85});
  for(let i=0;i<7;i++){
    ell(g,0xb6a486,.38-i*.012,.22,.55-i*.015,-1.0+i*.32,0,0,{roughness:.85});
  }
  ell(g,0x8f7a61,.45,.32,.48,1.45,.02,0);
  eyePair(g,1.7,.12,.3,.07,0x0b0d09);
  for(let i=0;i<12;i++){
    const side=i%2?1:-1;const x=-1.25+Math.floor(i/2)*.45;
    cyl(g,0x8d775d,.035,.025,.42,x,-.23,side*.42,side*.5,0,0);
  }
  tube(g,0x8d775d,[[1.7,.1,.25],[2.4,.25,.55],[3.0,.1,.7]],.025);
  tube(g,0x8d775d,[[1.7,.1,-.25],[2.4,.25,-.55],[3.0,.1,-.7]],.025);
  fin(g,0x8d775d,[[0,0],[-.3,.25],[-.4,-.05]],[-1.4,-.08,0],[0,0,0],[1,1,1]);
  return g;
}

function buildSeaPig(){
  const g=new T.Group();
  ell(g,0xd59b96,1.25,.5,.7,0,.15,0,{roughness:.7,transparent:true,opacity:.92});
  ell(g,0xe3b4ad,.5,.32,.5,.9,.2,0,{roughness:.7});
  [-1,1].forEach(s=>{
    for(let i=0;i<5;i++){
      const x=-.8+i*.42;
      cyl(g,0xc98b88,.055,.045,.48,x,-.18,s*.44,0,0,s*.12);
      add(g,sphereGeo,M(0xd8a09a),x,-.44,s*.44,.08,.06,.08);
    }
  });
  for(let i=0;i<7;i++)add(g,sphereGeo,M(0xe0aea7),-.5+i*.2,.52,rr(-.2,.2),.035,.11,.035,0,0,rr(-.3,.3));
  for(let i=0;i<6;i++)add(g,sphereGeo,B(0xffd3c4),rr(-.8,.8),.25,.7,.025,.025,.025);
  return g;
}

function buildSnailfish(){
  const g=new T.Group();
  ell(g,0xe3b3ad,.72,.55,.5,.8,.1,0,{transparent:true,opacity:.82,roughness:.45});
  ell(g,0xe9c2ba,.34,.28,.3,1.42,.15,0,{transparent:true,opacity:.82});
  eyePair(g,1.55,.23,.28,.075,0x0b0c0d);
  const pts=[];for(let i=0;i<=16;i++){const t=i/16;pts.push([.3-t*3.1,Math.sin(t*4)*.1,-.02]);}
  tube(g,0xd7a29d,pts,.16,{transparent:true,opacity:.75,roughness:.5});
  fin(g,0xf0d3cb,[[0,0],[-1.6,.18],[-2.7,-.02],[-1.2,-.1]],[-.45,.2,0],[0,0,0],[1,1,1],{transparent:true,opacity:.55});
  [-1,1].forEach(s=>fin(g,0xe8bbb1,[[0,0],[.35,.15],[.25,-.18]],[1.05,.03,s*.28],[s*.2,s*.15,0],[1,1,1],{transparent:true,opacity:.7}));
  for(let i=0;i<5;i++)add(g,sphereGeo,B(0x9dffe9),-1.8+i*.45,-.05,.18,.025,.025,.025);
  return g;
}

function buildAmphipod(){
  const g=new T.Group();
  const shell=M(0xd3c4a5,{roughness:.8});
  for(let i=0;i<6;i++)ell(g,0xd3c4a5,.36,.24,.42,1.05-i*.34,0,0,{roughness:.8});
  ell(g,0xaa9271,.32,.28,.34,1.25,.03,0);
  eyePair(g,1.42,.13,.2,.06,0x0a0906);
  for(let i=0;i<14;i++){
    const side=i%2?1:-1;const x=.65-Math.floor(i/2)*.32;
    cyl(g,0x9f8767,.028,.02,.36,x,-.2,side*.34,side*.4,0,0);
  }
  tube(g,0xaa9271,[[1.5,.08,.15],[2.2,.2,.35],[2.8,.08,.5]],.018);
  tube(g,0xaa9271,[[1.5,.08,-.15],[2.2,.2,-.35],[2.8,.08,-.5]],.018);
  fin(g,0xaa9271,[[0,0],[-.32,.22],[-.45,-.08]],[-1.0,-.02,0],[0,0,0],[1,1,1]);
  return g;
}

const builders={manta:buildManta,whaleshark:buildWhaleShark,turtle:buildTurtle,dolphin:buildDolphin,shark:buildShark,lanternfish:buildLanternfish,fireflysquid:buildFireflySquid,nautilus:buildNautilus,oarfish:buildOarfish,vampiresquid:buildVampireSquid,anglerfish:buildAnglerfish,pelicaneel:buildPelicanEel,fangtooth:buildFangtooth,dumbo:buildDumbo,isopod:buildIsopod,seapig:buildSeaPig,snailfish:buildSnailfish,amphipod:buildAmphipod};

/* ------------------------------------------------------------------ *
 * Scene assembly
 * ------------------------------------------------------------------ */
function addRocks(group,color,count,yBase){
  for(let i=0;i<count;i++){
    const m=new T.Mesh(new T.DodecahedronGeometry(rr(.2,.8),0),M(color,{roughness:1,flatShading:true}));
    m.position.set(rr(-13,13),yBase+rr(-.2,.15),rr(-4,3));
    m.rotation.set(rr(0,TAU),rr(0,TAU),rr(0,TAU));
    m.scale.y=rr(.35,.8);
    group.add(m);
  }
}
function addWhaleFall(group){
  const bone=M(0xd4c9aa,{roughness:.85});
  for(let i=0;i<7;i++){
    const rib=new T.Mesh(new T.TorusGeometry(.55,.055,5,12,Math.PI*1.1),bone);
    rib.position.set(3.4+i*.21,-3.35+Math.sin(i*.7)*.08,.1);
    rib.rotation.set(0,0,i%2?.35:-.25);
    group.add(rib);
  }
  const skull=new T.Mesh(new T.SphereGeometry(.55,10,7),bone);
  skull.position.set(5.4,-3.5,.2);skull.scale.set(1.2,.7,.85);group.add(skull);
  const jaw=new T.Mesh(new T.CylinderGeometry(.06,.04,1.5,6),bone);
  jaw.position.set(6.2,-3.55,.3);jaw.rotation.z=Math.PI/2;group.add(jaw);
}
function makeFloor(group,zone){
  const floor=new T.Mesh(new T.PlaneGeometry(55,28),M(zone.id==="hadalpelagic"?0x171a1c:0x2c302c,{roughness:1,flatShading:true}));
  floor.rotation.x=-Math.PI/2;floor.position.set(0,-4.1,0);group.add(floor);
  addRocks(group,zone.id==="hadalpelagic"?0x25292b:0x3a3a31,16,-3.7);
  if(zone.whaleFall)addWhaleFall(group);
  if(zone.trench){
    [-1,1].forEach(side=>{
      const wall=new T.Mesh(new T.PlaneGeometry(11,15),M(0x111618,{roughness:1,side:T.DoubleSide}));
      wall.position.set(side*10.5,-.4,0);wall.rotation.y=side*Math.PI/2;wall.rotation.z=.08*side;group.add(wall);
    });
  }
}
function setupZone(i){
  const zone=zones[i];
  const group=zoneGroups[i];
  if(zone.floor)makeFloor(group,zone);
  zone.creatures.forEach((def,index)=>{
    const root=builders[def.builder]();
    root.position.set(def.pos[0],def.pos[1],def.pos[2]);
    root.rotation.set(def.rot[0],def.rot[1],def.rot[2]);
    root.scale.setScalar(def.scale);
    group.add(root);
    models.push({root:root,def:def,zone:i,baseX:def.pos[0],baseY:def.pos[1],baseZ:def.pos[2],rotX:def.rot[0],rotY:def.rot[1],rotZ:def.rot[2],phase:def.phase||index,bob:def.bob||.08,scale:def.scale});
  });
}
zones.forEach((z,i)=>setupZone(i));

function applyPalette(zone){
  bgUniforms.uTop.value.setHex(zone.palette.top);
  bgUniforms.uBottom.value.setHex(zone.palette.bottom);
  bgUniforms.uGlow.value.setHex(zone.palette.glow);
  bgUniforms.uRays.value=zone.palette.rays;
  bgUniforms.uCaustic.value=zone.palette.caustic;
  scene.fog.color.setHex(zone.palette.fog);
  scene.fog.density=zone.id==="epipelagic"?.012:zone.id==="mesopelagic"?.017:.022;
  snow.material.color.setHex(zone.palette.snow);
  snow.material.size=zone.palette.snowSize;
  snow.material.opacity=zone.palette.snowOpacity;
  glow.material.opacity=zone.id==="epipelagic"?.12:zone.id==="mesopelagic"?.55:zone.id==="bathypelagic"?.42:.22;
  glow.material.color.setHex(zone.id==="mesopelagic"?0x68e9e7:0x3f9dab);
}

/* Thumbnails rendered from the real 3D specimen */
const previewScene=new T.Scene();
previewScene.add(new T.AmbientLight(0xdcfff7,1.25));
const pKey=new T.DirectionalLight(0xffeac8,1.15);pKey.position.set(-3,7,5);previewScene.add(pKey);
const previewCamera=new T.PerspectiveCamera(30,360/140,.1,40);
previewCamera.position.set(0,1.4,7.0);previewCamera.lookAt(0,0,0);
const previewRT=new T.WebGLRenderTarget(360,140,{minFilter:T.LinearFilter,magFilter:T.LinearFilter,format:T.RGBAFormat,depthBuffer:true,stencilBuffer:false});
const thumbCache={};
function fitPreview(root){
  root.rotation.set(0,.2,0);
  const box=new T.Box3().setFromObject(root);
  const size=new T.Vector3();box.getSize(size);
  const max=Math.max(size.x,size.y,size.z)||1;
  root.scale.multiplyScalar(3.45/max);
  box.setFromObject(root);
  const center=new T.Vector3();box.getCenter(center);
  root.position.sub(center);
}
function renderThumb(def,canvas){
  if(!canvas.isConnected)return;
  if(thumbCache[def.id]){const ctx=canvas.getContext("2d");ctx.drawImage(thumbCache[def.id],0,0,canvas.width,canvas.height);return;}
  const root=builders[def.builder]();
  if(def.cardRot)root.rotation.set(def.cardRot[0],def.cardRot[1],def.cardRot[2]);
  fitPreview(root);
  previewScene.add(root);
  renderer.setRenderTarget(previewRT);
  renderer.setClearColor(0x000000,0);
  renderer.clear(true,true,false);
  renderer.render(previewScene,previewCamera);
  const w=360,h=140;const buf=new Uint8Array(w*h*4);
  try{
    renderer.readRenderTargetPixels(previewRT,0,0,w,h,buf);
    const image=new ImageData(w,h);
    for(let y=0;y<h;y++){const src=(h-1-y)*w*4;image.data.set(buf.subarray(src,src+w*4),y*w*4);}
    const ctx=canvas.getContext("2d");ctx.clearRect(0,0,w,h);
    const glowGrad=ctx.createRadialGradient(w*.5,h*.55,3,w*.5,h*.55,w*.4);
    glowGrad.addColorStop(0,"rgba(111,235,216,.18)");glowGrad.addColorStop(1,"rgba(0,20,30,0)");
    ctx.fillStyle=glowGrad;ctx.fillRect(0,0,w,h);
    const tmp=document.createElement("canvas");tmp.width=w;tmp.height=h;tmp.getContext("2d").putImageData(image,0,0);
    ctx.drawImage(tmp,0,0);thumbCache[def.id]=tmp;
  }catch(error){
    const ctx=canvas.getContext("2d");ctx.fillStyle="rgba(126,236,215,.16)";ctx.fillRect(0,0,w,h);
  }
  previewScene.remove(root);
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x020b12,1);
}

/* Nav, cards and panels */
function buildNav(){
  zones.forEach((z,i)=>{
    const b=document.createElement("button");
    b.type="button";b.dataset.zone=String(i);b.setAttribute("aria-pressed",i===0?"true":"false");
    const name=document.createElement("b");name.textContent=z.name;
    const depth=document.createElement("small");depth.textContent=z.range;
    b.append(name,depth);b.addEventListener("click",()=>switchZone(i));nav.appendChild(b);
  });
}
function buildCards(zone){
  cardsEl.innerHTML="";
  cardsEl.className="cards"+(zone.creatures.length===1?" is-single":zone.creatures.length===2?" is-double":"");
  countEl.textContent=zone.creatures.length+" 种 / 本层";
  zone.creatures.forEach((def,i)=>{
    const card=document.createElement("button");
    card.type="button";card.className="card is-new";card.style.animationDelay=(i*45)+"ms";
    card.setAttribute("aria-label","查看"+def.name+"的完整百科");
    const cv=document.createElement("canvas");cv.width=360;cv.height=140;cv.setAttribute("aria-hidden","true");
    const num=document.createElement("span");num.className="num";num.textContent="0"+(i+1);
    const tag=document.createElement("span");tag.className="tag";tag.textContent=def.tag;
    const copy=document.createElement("span");copy.className="copy";
    const name=document.createElement("b");name.textContent=def.name;
    const latin=document.createElement("small");latin.textContent=def.latin;
    copy.append(name,latin);card.append(cv,num,tag,copy);
    card.addEventListener("click",()=>{postCreature(def.id);if(!embedded)toast("正在打开"+def.name+"的生物百科");});
    cardsEl.appendChild(card);
    setTimeout(()=>renderThumb(def,cv),40+i*35);
  });
}
function applyZone(i){
  currentZone=i;const zone=zones[i];
  zoneGroups.forEach((g,j)=>{g.visible=i===j;});
  applyPalette(zone);
  titleEl.querySelector(".kicker").textContent="0"+(i+1)+" / "+zone.en;
  titleEl.querySelector("h2").textContent=zone.name;
  titleEl.querySelector(".range").textContent=zone.range;
  titleEl.querySelector("p:last-child").textContent=zone.intro;
  nav.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",i===j?"true":"false"));
  buildCards(zone);
  camera.position.y=zone.floor?-.2:1.3;
}
let switching=false;
function switchZone(i){
  if(i===currentZone||switching||i<0||i>=zones.length)return;
  switching=true;
  flash.style.opacity=".85";
  applyZone(i);
  setTimeout(()=>{
    flash.style.opacity="0";
    switching=false;
  },170);
}
buildNav();
applyZone(0);

/* Interaction and animation */
let mouseX=0,mouseY=0,pointerX=0,pointerY=0;
window.addEventListener("pointermove",e=>{pointerX=(e.clientX/innerWidth-.5)*2;pointerY=(e.clientY/innerHeight-.5)*2;},{passive:true});
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();switchZone((currentZone+zones.length-1)%zones.length);}
  else if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();switchZone((currentZone+1)%zones.length);}
  else if(/^[1-5]$/.test(e.key)){e.preventDefault();switchZone(Number(e.key)-1);}
});
function onResize(){
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  layoutCamera();
}
window.addEventListener("resize",onResize);

let time=0,last=0,ready=false;
function animate(now){
  requestAnimationFrame(animate);
  if(!last)last=now;
  const raw=(now-last)/1000;last=now;
  if(document.hidden)return;
  const dt=Math.min(raw,.05);time+=dt;
  mouseX+=(pointerX-mouseX)*Math.min(1,dt*2.2);
  mouseY+=(pointerY-mouseY)*Math.min(1,dt*2.2);
  bgUniforms.uTime.value=time;
  camera.position.x=cameraTargetX+mouseX*.55+Math.sin(time*.11)*.12;
  camera.position.y=(zones[currentZone].floor?-.2:1.3)-mouseY*.35+Math.sin(time*.17)*.05;
  camera.lookAt(cameraTargetX,.05,0);
  models.forEach(m=>{
    if(!zoneGroups[m.zone].visible)return;
    m.root.position.y=m.baseY+Math.sin(time*.62+m.phase)*m.bob;
    m.root.position.x=m.baseX+Math.sin(time*.23+m.phase)*.09;
    m.root.rotation.y=m.rotY+Math.sin(time*.28+m.phase)*.07;
    m.root.rotation.z=m.rotZ+Math.sin(time*.41+m.phase)*.025;
    if(m.root.userData.lure)m.root.userData.lure.scale.setScalar(.11+Math.sin(time*2.4)*.025);
  });
  const snowPos=snow.geometry.attributes.position;
  const glowPos=glow.geometry.attributes.position;
  for(let i=0;i<snowPos.count;i++){
    let y=snowPos.getY(i)-dt*(.10+((i%7)*.014));
    let x=snowPos.getX(i)+Math.sin(time*.2+i)*dt*.03;
    if(y<-9){y=9;x=rr(-17,17);}
    snowPos.setXY(i,x,y);
  }
  snowPos.needsUpdate=true;
  for(let i=0;i<glowPos.count;i++){
    let y=glowPos.getY(i)+Math.sin(time*.5+i)*dt*.12;
    let x=glowPos.getX(i)+Math.cos(time*.3+i)*dt*.06;
    if(y>9)y=-9;if(y<-9)y=9;if(x>17)x=-17;if(x<-17)x=17;
    glowPos.setXY(i,x,y);
  }
  glowPos.needsUpdate=true;
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x020b12,1);
  renderer.clear(true,true,false);
  renderer.render(bgScene,bgCamera);
  renderer.clearDepth();
  renderer.render(scene,camera);
  if(!ready){
    ready=true;
    setTimeout(()=>{loading.classList.add("done");setTimeout(()=>{loading.style.display="none";},1000);},280);
  }
}
requestAnimationFrame(animate);
})();
