  root.visible = false;
  root.renderOrder = 5;
  overlayScene.add(root);
  return {
    root: root, def: def, ray: null, bell: bell, tentacles: tentacles, busy: false, kind: "jelly",
    jelly: { tentacles: tentacles, vx: 0, vz: 0, phase: rr(0, TAU) },
  };
}

const displayPool = {};
function acquireDisplay(def) {
  if (!displayPool[def.id]) displayPool[def.id] = [];
  const list = displayPool[def.id];
  for (let i = 0; i < list.length; i++) {
    if (!list[i].busy) {
      list[i].busy = true;
      list[i].root.visible = true;
      return list[i];
    }
  }
  const display = createDisplayVisual(def);
  display.busy = true;
  display.root.visible = true;
  list.push(display);
  return display;
}
function releaseDisplay(display) {
  if (!display) return;
  display.busy = false;
  display.root.visible = false;
}

function animateDisplay(display, time, dt, held) {
  if (!display) return;
  const def = display.def;
  if (display.kind === "ray") {
    const ray = display.ray;
    ray.material.uniforms.uTime.value = time;
    updateTail(ray.tail, time, 0.8, ray.material.uniforms.uPhase.value);
  } else {
    const contract = 1 + 0.12 * Math.sin(time * 2.2 + display.jelly.phase);
    display.bell.scale.set(1 - 0.08 * contract, 1 + 0.08 * contract, 1 - 0.08 * contract);
    display.bell.material.uniforms.uTime.value = time;
    display.jelly.vx = Math.sin(time * 0.7) * 0.15;
    display.jelly.vz = Math.cos(time * 0.6) * 0.15;
    updateTentacles(display.jelly, time, held);
  }
}

function renderThumbnail(def, targetCanvas) {
  const group = new T.Group();
  previewScene.add(group);
  if (def.kind === "ray") {
    const visual = createRayVisual(def, 1.1, true);
    visual.material.uniforms.uTime.value = 0.7;
    visual.root.scale.setScalar(1.08);
    visual.root.rotation.y = 0.24;
    visual.root.rotation.x = -0.12;
    group.add(visual.root);
    updateTail(visual.tail, 0.7, 0.6, 1.1);
  } else {
    const root = new T.Group();
    const bell = new T.Mesh(createBellGeometry(def), createJellyMaterial(def));
    bell.material.uniforms.uTime.value = 0.9;
    const tentacles = createTentacleMesh(def);
    root.add(bell);
    root.add(tentacles);
    root.position.y = 0.2;
    root.scale.setScalar(1.06);
    group.add(root);
    const fake = { tentacles: tentacles, vx: 0.22, vz: 0.12, phase: 0.8 };
    updateTentacles(fake, 0.9, false);
  }

  renderer.setRenderTarget(previewRT);
  renderer.setClearColor(0x000000, 0);
  renderer.clear(true, true, false);
  renderer.render(previewScene, previewCamera);

  const width = 360;
  const height = 220;
  const pixels = new Uint8Array(width * height * 4);
  try {
    renderer.readRenderTargetPixels(previewRT, 0, 0, width, height, pixels);
    const image = new ImageData(width, height);
    for (let y = 0; y < height; y++) {
      const src = (height - 1 - y) * width * 4;
      const dst = y * width * 4;
      image.data.set(pixels.subarray(src, src + width * 4), dst);
    }
    const ctx = targetCanvas.getContext("2d");
    ctx.clearRect(0, 0, width, height);
    const glow = ctx.createRadialGradient(width * 0.5, height * 0.56, 4, width * 0.5, height * 0.56, width * 0.42);
    glow.addColorStop(0, "rgba(132,245,222,.20)");
    glow.addColorStop(0.55, "rgba(58,180,174,.08)");
    glow.addColorStop(1, "rgba(0,40,50,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, height);
    const art = document.createElement("canvas");
    art.width = width;
    art.height = height;
    art.getContext("2d").putImageData(image, 0, 0);
    ctx.drawImage(art, 0, 0);
  } catch (error) {
    const ctx = targetCanvas.getContext("2d");
    const grad = ctx.createLinearGradient(0, 0, width, height);
    grad.addColorStop(0, "rgba(166,239,218,.25)");
    grad.addColorStop(1, "rgba(3,44,57,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
  }
  previewScene.remove(group);
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x073f4a, 1);
}

const cardElements = [];
function buildCards() {
  speciesDefs.forEach((def, index) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.setAttribute("aria-label", "放生" + def.name + "，点击抛入海中，或拖动放置");
    card.dataset.species = def.id;
    card.title = def.name + " · 点按抛入 / 拖动放置";
    const cv = document.createElement("canvas");
    cv.width = 360;
    cv.height = 220;
    cv.setAttribute("aria-hidden", "true");
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = "0" + (index + 1);
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = def.tag;
    const copy = document.createElement("span");
    copy.className = "copy";
    const name = document.createElement("b");
    name.textContent = def.name;
    const latin = document.createElement("small");
    latin.textContent = def.latin;
    copy.appendChild(name);
    copy.appendChild(latin);
    card.appendChild(cv);
    card.appendChild(num);
    card.appendChild(tag);
    card.appendChild(copy);
    cardsRoot.appendChild(card);
    cardElements.push(card);
    card.addEventListener("pointerdown", (event) => onCardDown(event, def, card));
    card.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        throwFromCard(def, card);
      }
    });
    card.addEventListener("dragstart", (event) => event.preventDefault());
    renderThumbnail(def, cv);
  });
}

/* ------------------------------------------------------------------ *
 * Holding and throwing
 * ------------------------------------------------------------------ */

let held = null;
let cardDrag = null;
const flights = [];
let drips = 0;

function totalResidents() {
  return rays.length + jellies.length;
}
function updateCounts() {
  byId("ray-count").textContent = String(rays.length);
  byId("jelly-count").textContent = String(jellies.length);
  byId("creature-total").textContent = String(totalResidents());
  byId("cap-line").textContent = "当前 " + totalResidents() + " 位 · 上限 48 位";
}
let toastTimer = 0;
function toast(message, duration) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => toastEl.classList.remove("show"), duration || 2600);
}

function beginHeld(def, clientX, clientY) {
  if (totalResidents() >= 48) {
    toast("浅海已经住满 48 位居民。先让一些生物游回深海吧。");
    return null;
  }
  const p = screenToWorld(clientX, clientY);
  const display = acquireDisplay(def);
  display.root.position.set(p.x, 2.8, p.z);
  held = { def: def, display: display, x: p.x, z: p.z, y: 2.8 };
  drips = 0;
  audio.plink(620);
  return held;
}

function updateHeld(clientX, clientY) {
  if (!held) return;
  const p = screenToWorld(clientX, clientY);
  held.x = clamp(p.x, CAM_LEFT + 0.8, viewRight - 0.8);
  held.z = clamp(p.z, topZ + 0.8, bottomZ - 0.8);
}

function updateHeldVisual(dt) {
  if (!held) return;
  const display = held.display;
  const bob = Math.sin(state.time * 2.4) * 0.06;
  display.root.position.set(held.x, held.y + bob, held.z);
  display.root.rotation.y = Math.sin(state.time * 0.75) * 0.45;
  animateDisplay(display, state.time, dt, true);
  drips += dt;
  if (drips > 0.34) {
    drips = 0;
    const tipY = display.kind === "jelly" ? held.y - 1.15 : held.y - 0.2;
    splashParticles.spawn(held.x + rr(-0.22, 0.22), Math.max(0.12, tipY), held.z + rr(-0.2, 0.2), {
      vx: rr(-0.12, 0.12), vz: rr(-0.12, 0.12), vy: -0.2,
      size: rr(1.2, 2.6), life: rr(0.7, 1.25), color: [0.79, 0.98, 0.94], alpha: 0.45,
    });
    if (audio.enabled && random() < 0.42) audio.drip();
  }
}

function launchFlight(def, start, end, opts) {
  const options = opts || {};
  const display = options.display || acquireDisplay(def);
  const dx = end.x - start.x;
  const dz = end.z - start.z;
  const distance = Math.hypot(dx, dz);
  const flight = {
    def: def, display: display,
    sx: start.x, sz: start.z, sy: start.y == null ? 2.8 : start.y,
    ex: end.x, ez: end.z,
    t: 0, dur: options.duration || clamp(0.78 + distance * 0.045, 0.82, 1.5),
    arc: options.arc == null ? 1.65 + distance * 0.10 : options.arc,
    spin: rr(-1, 1) > 0 ? 1 : -1, trail: 0,
  };
  display.root.visible = true;
  display.root.position.set(start.x, flight.sy, start.z);
  flights.push(flight);
  audio.plink(options.drop ? 760 : 690);
  return flight;
}

function updateFlights(dt) {
  for (let i = flights.length - 1; i >= 0; i--) {
    const f = flights[i];
    f.t += dt / f.dur;
    const u = clamp(f.t, 0, 1);
    const ease = u * u * (3 - 2 * u);
    f.display.root.position.x = lerp(f.sx, f.ex, ease);
    f.display.root.position.z = lerp(f.sz, f.ez, ease);
    f.display.root.position.y = lerp(f.sy, 0.02, u) + Math.sin(u * Math.PI) * f.arc;
    f.display.root.rotation.y += dt * 2.8 * f.spin;
    if (f.display.kind === "ray") {
      f.display.ray.bank.rotation.z = Math.sin(u * Math.PI) * 0.55 * f.spin;
    }
    animateDisplay(f.display, state.time, dt, false);
    f.trail += dt;
    if (f.trail > 0.08) {
      f.trail = 0;
      splashParticles.spawn(f.display.root.position.x, f.display.root.position.y - 0.15, f.display.root.position.z, {
        vx: rr(-0.18, 0.18), vz: rr(-0.18, 0.18), vy: -0.25,
        size: rr(1.0, 2.4), life: rr(0.4, 0.85), color: [0.83, 1.0, 0.95], alpha: 0.55,
      });
    }
    if (u >= 1) {
      const def = f.def;
      const landing = nearestWater(f.ex, f.ez);
      releaseDisplay(f.display);
      spawnSplash(landing.x, landing.z, 1.15);
      addRipple((landing.x - CAM_LEFT) / viewWidth, (9 - landing.z) / 18, 0.9);
      audio.burst(0.85);
      audio.plink(1120);
      addCreature(def, landing.x, landing.z, { spawn: true });
      flights.splice(i, 1);
    }
  }
}

function dropHeld() {
  if (!held) return;
  const def = held.def;
  const start = { x: held.x, z: held.z, y: held.y };
  const p = screenToWorld(lastPointer.x, lastPointer.y);
  const q = nearestWater(p.x, p.z);
  const end = {
    x: clamp(q.x, CAM_LEFT + 1.0, viewRight - 1.0),
    z: clamp(q.z, topZ + 1.0, bottomZ - 1.0),
  };
  const display = held.display;
  held = null;
  launchFlight(def, start, end, { display: display, duration: 0.62, arc: 0.62, drop: true });
  toast("松手 · 它落进了浅海");
}

function throwFromCard(def, card) {
  if (totalResidents() >= 48) {
    toast("浅海已经住满 48 位居民。先让一些生物游回深海吧。");
    card.classList.remove("is-spawning");
    void card.offsetWidth;
    card.classList.add("is-spawning");
    return;
  }
  const w = window.innerWidth;
  const h = window.innerHeight;
  const rect = card.getBoundingClientRect();
  const start = screenToWorld(w * 0.5, h - (narrowScreen() ? 156 : 206));
  const target = randomWaterPoint(3.2, -5.6, 4.8);
  start.y = 2.8;
  launchFlight(def, start, target, {});
  toast("抛出去了 · 看它划一道弧");
  card.classList.remove("is-spawning");
  void card.offsetWidth;
  card.classList.add("is-spawning");
}

let lastPointer = { x: window.innerWidth * 0.5, y: window.innerHeight * 0.5 };
function onCardDown(event, def, card) {
  if (event.button != null && event.button !== 0) return;
  event.preventDefault();
  if (held) return;
  lastPointer = { x: event.clientX, y: event.clientY };
  cardDrag = {
    def: def, card: card, id: event.pointerId,
    startX: event.clientX, startY: event.clientY,
    moved: false,
  };
  card.classList.add("is-spawning");
}
window.addEventListener("pointermove", (event) => {
  lastPointer = { x: event.clientX, y: event.clientY };
  if (!cardDrag) return;
  const dx = event.clientX - cardDrag.startX;
  const dy = event.clientY - cardDrag.startY;
  if (!cardDrag.moved && Math.hypot(dx, dy) > 8) {
    cardDrag.moved = true;
    if (beginHeld(cardDrag.def, event.clientX, event.clientY) === null) {
      cardDrag = null;
      return;
    }
  }
  if (cardDrag && cardDrag.moved && held) updateHeld(event.clientX, event.clientY);
}, { passive: true });
window.addEventListener("pointerup", (event) => {
  if (!cardDrag || event.pointerId !== cardDrag.id) return;
  const drag = cardDrag;
  cardDrag = null;
  drag.card.classList.remove("is-spawning");
  if (drag.moved && held) dropHeld();
  else throwFromCard(drag.def, drag.card);
});
window.addEventListener("pointercancel", (event) => {
  if (cardDrag && event.pointerId === cardDrag.id) {
    cardDrag.card.classList.remove("is-spawning");
    cardDrag = null;
  }
});

function addCreature(def, x, z, opts) {
  if (totalResidents() >= 48) {
    toast("浅海已经住满 48 位居民。先让一些生物游回深海吧。");
    return null;
  }
  const q = nearestWater(x, z);
  let creature;
  if (def.kind === "ray") {
    creature = createRay(def, q.x, q.z, { spawn: opts && opts.spawn });
  } else {
    creature = createJelly(def, q.x, q.z, { spawn: opts && opts.spawn });
  }
  updateCounts();
  const message = "放生了一只" + def.name;
  toast(message);
  const card = cardElements[speciesDefs.indexOf(def)];
  if (card) {
    card.classList.remove("is-spawning");
    void card.offsetWidth;
    card.classList.add("is-spawning");
  }
  return creature;
}


/* ------------------------------------------------------------------ *
 * Creature behaviour
 * ------------------------------------------------------------------ */

function angleDelta(a, b) {
  return Math.atan2(Math.sin(a - b), Math.cos(a - b));
}
function easeOutBack(t) {
  const c = 1.70158;
  const x = t - 1;
  return 1 + (c + 1) * x * x * x + c * x * x;
}
function keepInViewX(x) {
  return clamp(x, CAM_LEFT + 1.0, viewRight - 1.0);
}

function updateRay(ray, dt) {
  const def = ray.def;
  ray.age += dt;
  ray.spawn = Math.min(1, ray.spawn + dt * 1.7);
  const grow = ray.spawn < 1 ? Math.max(0.02, easeOutBack(clamp(ray.spawn, 0, 1))) : 1;
  ray.root.scale.setScalar(def.bodyScale * grow);

  if (ray.breachTimer == null) ray.breachTimer = rr(12, 27);
  if (ray.flee > 0) {
    ray.flee -= dt;
    if (ray.flee <= 0) {
      ray.target = randomWaterPoint(2.5, -7.4, 7.2);
    }
  }

  if (ray.resting && ray.flee > 0) {
    ray.resting = false;
    ray.restTimer = 8.5;
  }
  if (!ray.resting && def.index === 2) {
    ray.restTimer = (ray.restTimer == null ? 8 : ray.restTimer) - dt;
    if (ray.restTimer <= 0 && ray.speed < 0.24) {
      ray.resting = true;
      ray.speed = 0.02;
    }
  }

  if (ray.breach) {
    const b = ray.breach;
    b.t += dt / b.dur;
    const u = clamp(b.t, 0, 1);
    ray.root.position.x += -Math.sin(ray.heading) * 1.25 * dt;
    ray.root.position.z += -Math.cos(ray.heading) * 1.25 * dt;
    ray.root.position.y = -0.43 + Math.sin(u * Math.PI) * 2.05;
    ray.bank.rotation.x = -Math.PI * Math.sin(u * Math.PI);
    ray.bank.rotation.z = Math.sin(u * Math.PI * 2) * 0.34;
    ray.material.uniforms.uTime.value = state.time;
    if (u > 0.10 && ray.root.parent !== overlayScene) overlayScene.add(ray.root);
    if (u > 0.90 && ray.root.parent !== worldScene) worldScene.add(ray.root);
    updateTail(ray.tail, state.time, 1.2, ray.phase);
    ray.shadow.position.set(ray.root.position.x + 0.55, -0.695, ray.root.position.z + 0.62);
    ray.shadow.scale.setScalar(1.15 + Math.sin(u * Math.PI) * 0.5);
    ray.shadow.material.opacity = 0.10 + 0.12 * (1 - Math.sin(u * Math.PI));
    if (u >= 1) {
      ray.breach = null;
      ray.root.position.y = -0.43;
      ray.bank.rotation.x = 0;
      worldScene.add(ray.root);
      spawnSplash(ray.root.position.x, ray.root.position.z, 1.2);
      audio.burst(0.9);
      ray.breachTimer = rr(18, 34);
    }
    return;
  }

  if (!ray.resting) {
    ray.wanderTimer -= dt;
    if (ray.wanderTimer <= 0 && ray.flee <= 0) {
      ray.target = randomWaterPoint(2.5, -7.4, 7.3);
      ray.wanderTimer = rr(4, 9);
    }
    if (ray.flee > 0 && !ray.fleeTarget) {
      ray.fleeTarget = randomWaterPoint(2.5, -7.4, 7.3);
    }
    const target = ray.flee > 0 ? ray.fleeTarget : ray.target;
    if (target) {
      const dx = target.x - ray.x;
      const dz = target.z - ray.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.7 && ray.flee <= 0) {
        ray.target = randomWaterPoint(2.5, -7.4, 7.3);
      }
      const desired = Math.atan2(-dx, -dz);
      const diff = angleDelta(desired, ray.heading);
      const maxTurn = (ray.flee > 0 ? 2.7 : 1.45) * dt;
      ray.heading += clamp(diff, -maxTurn, maxTurn);
      ray.turn = diff;
      ray.bankAngle = damp(ray.bankAngle, clamp(-diff * 1.5, -0.64, 0.64), 3.2, dt);
    }
    const targetSpeed = ray.flee > 0 ? 1.85 : ray.cruise;
    ray.speed = damp(ray.speed, targetSpeed, ray.flee > 0 ? 3.2 : 1.0, dt);
    const step = ray.speed * dt;
    ray.x += -Math.sin(ray.heading) * step;
    ray.z += -Math.cos(ray.heading) * step;
  } else {
    ray.speed = damp(ray.speed, 0.02, 2, dt);
    ray.bankAngle = damp(ray.bankAngle, 0, 2, dt);
    ray.wanderTimer = 1.4;
    if (random() < dt * 0.18) {
      ray.target = randomWaterPoint(2.5, -6.5, 6.5);
      ray.wanderTimer = 1.2;
    }
  }

  if (!isWater(ray.x, ray.z)) {
    const q = nearestWater(keepInViewX(ray.x), clamp(ray.z, topZ + 1.0, bottomZ - 1.0));
    ray.x = q.x;
    ray.z = q.z;
    ray.heading = Math.atan2(-(ray.target.x - ray.x), -(ray.target.z - ray.z));
    ray.bankAngle = damp(ray.bankAngle, 0, 4, dt);
  } else if (ray.x < CAM_LEFT + 1.0 || ray.x > viewRight - 1.0 || ray.z < topZ + 1.0 || ray.z > bottomZ - 1.0) {
    ray.target = randomWaterPoint(2.6, -7.2, 7.1);
    ray.heading = Math.atan2(-(ray.target.x - ray.x), -(ray.target.z - ray.z));
    ray.bankAngle = damp(ray.bankAngle, 0, 4, dt);
  }

  const bob = Math.sin(state.time * 0.66 + ray.phase) * 0.035;
  ray.y = ray.resting ? -0.565 + bob * 0.15 : -0.43 + bob;
  ray.root.position.set(ray.x, ray.y, ray.z);
  ray.root.rotation.y = ray.heading;
  ray.bank.rotation.x = 0;
  ray.bank.rotation.z = ray.bankAngle;
  ray.material.uniforms.uTime.value = state.time;
  ray.material.uniforms.uFlap.value = def.flap * (ray.resting ? 0.42 : 1) * (1 + ray.speed * 0.45);
  updateTail(ray.tail, state.time, ray.speed, ray.phase);

  const height = Math.max(0, ray.root.position.y + 0.43);
  ray.shadow.position.set(ray.x + 0.34 + height * 0.15, -0.695, ray.z + 0.44 + height * 0.12);
  ray.shadow.scale.setScalar(1 + height * 0.12);
  ray.shadow.material.opacity = ray.resting ? 0.26 : 0.23 / (1 + height * 0.55);

  if (!ray.resting && ray.speed > 0.35) {
    ray.wakeTimer -= dt;
    if (ray.wakeTimer <= 0) {
      ray.wakeTimer = rr(0.42, 0.72);
      spawnRing(ray.x + 0.1, ray.z + 0.22, rr(0.35, 0.62), 0.16, 0, 0xc8fff0);
    }
  }

  if (def.index < 2 && ray.flee <= 0 && ray.breachTimer > 0) {
    ray.breachTimer -= dt;
    if (ray.breachTimer <= 0) {
      ray.breach = { t: 0, dur: rr(2.05, 2.9) };
      spawnSplash(ray.x, ray.z, 0.55);
      audio.burst(0.38);
    }
  }
}

function startleRay(ray, fromX, fromZ) {
  const dx = ray.x - fromX;
  const dz = ray.z - fromZ;
  const len = Math.hypot(dx, dz) || 1;
  ray.flee = 3.0;
  ray.resting = false;
  ray.restTimer = 8.5;
  ray.fleeTarget = {
    x: clamp(ray.x + (dx / len) * 5.5, CAM_LEFT + 1.5, viewRight - 1.5),
    z: clamp(ray.z + (dz / len) * 5.5, topZ + 1.5, bottomZ - 1.5),
  };
  ray.speed = 1.35;
  ray.bankAngle = 0.2;
  spawnRing(ray.x, ray.z, 0.55, 0.32, 0, 0xbaffeb);
  if (ray.def.index === 2) spawnSilt(ray.x, ray.z);
  audio.plink(ray.def.index === 0 ? 760 : 930);
  toast(ray.def.index === 2 ? "魟鱼从沙里弹起，扬起一小团细沙" : "它被碰了一下，摆尾游向更深处");
}

function updateJelly(jelly, dt) {
  const def = jelly.def;
  jelly.age += dt;
  jelly.spawn = Math.min(1, jelly.spawn + dt * 1.35);
  const grow = jelly.spawn < 1 ? Math.max(0.02, easeOutBack(jelly.spawn)) : 1;
  jelly.root.scale.setScalar(grow);
  if (jelly.startle > 0) jelly.startle -= dt;

  const rawPulse = state.time * 0.40 + jelly.phase;
  const p = rawPulse % 1;
  if (p < jelly.pulse) {
    jelly.vx += -Math.sin(jelly.heading) * 0.15;
    jelly.vz += -Math.cos(jelly.heading) * 0.15;
    jelly.mouth = 1;
  }
  if (p < jelly.pulse && p > jelly.pulse - 0.02) {
    audio.plink(420 + rr(0, 80));
  }
  jelly.pulse = p;
  const contract = p < 0.23 ? Math.sin((p / 0.23) * Math.PI) : Math.max(0, Math.exp(-(p - 0.23) * 4.7) * 0.34);

  jelly.vx += Math.sin(state.time * 0.22 + jelly.phase + 1.3) * 0.019 * dt;
  jelly.vz += Math.cos(state.time * 0.18 + jelly.phase - 0.6) * 0.016 * dt;
  if (jelly.startle > 0) {
    jelly.vx += Math.sin(jelly.heading) * 0.28 * dt;
    jelly.vz += Math.cos(jelly.heading) * 0.28 * dt;
  }
  if (state.whirlAmount > 0.05) {
    const dx = jelly.x - state.pool.x;
    const dz = jelly.z - state.pool.z;
    const r = Math.hypot(dx, dz);
    if (r < state.pool.z + 4.0 && r > 0.08) {
      const pull = (1 - r / (state.pool.z + 4.0)) * state.whirlAmount;
      jelly.vx += (-dz / r) * pull * 0.45 * dt;
      jelly.vz += (dx / r) * pull * 0.45 * dt;
      jelly.vx -= (dx / r) * pull * 0.18 * dt;
      jelly.vz -= (dz / r) * pull * 0.18 * dt;
    }
  }
  jelly.vx *= Math.exp(-0.58 * dt);
  jelly.vz *= Math.exp(-0.58 * dt);
  jelly.x += jelly.vx * dt;
  jelly.z += jelly.vz * dt;

  if (jelly.x < CAM_LEFT + 0.8 || jelly.x > viewRight - 0.8 || jelly.z < topZ + 0.8 || jelly.z > bottomZ - 0.8) {
    jelly.heading = Math.atan2(-(CAM_LEFT + viewWidth * 0.5 - jelly.x), -(0 - jelly.z));
    jelly.vx += Math.sin(jelly.heading) * 0.17;
    jelly.vz += Math.cos(jelly.heading) * 0.17;
    jelly.x = clamp(jelly.x, CAM_LEFT + 0.75, viewRight - 0.75);
    jelly.z = clamp(jelly.z, topZ + 0.75, bottomZ - 0.75);
  }
  if (!isWater(jelly.x, jelly.z)) {
    const q = nearestWater(jelly.x, jelly.z);
    jelly.x = q.x;
    jelly.z = q.z;
  }

  jelly.y = 0.82 + Math.sin(state.time * 0.67 + jelly.phase) * 0.11 + contract * 0.10;
  jelly.root.position.set(jelly.x, jelly.y, jelly.z);
  jelly.root.rotation.y = jelly.heading * 0.14 + Math.sin(state.time * 0.13 + jelly.phase) * 0.16;
  jelly.bell.scale.set(1 - contract * 0.13, 1 + contract * 0.10, 1 - contract * 0.13);
  jelly.bell.material.uniforms.uTime.value = state.time;
  jelly.mouth = Math.max(0, jelly.mouth - dt * 1.7);
  updateTentacles(jelly, state.time, false);
  jelly.shadow.position.set(jelly.x + 0.28, -0.695, jelly.z + 0.32);
  jelly.shadow.material.opacity = 0.14 / (1 + Math.max(0, jelly.y - 0.4) * 0.5);
  jelly.shadow.scale.setScalar(0.9 + Math.max(0, jelly.y - 0.4) * 0.18);
}

function startleJelly(jelly, fromX, fromZ) {
  const dx = jelly.x - fromX;
  const dz = jelly.z - fromZ;
  const len = Math.hypot(dx, dz) || 1;
  jelly.heading = Math.atan2(-dx / len, -dz / len);
  jelly.vx += (dx / len) * 0.55;
  jelly.vz += (dz / len) * 0.55;
  jelly.startle = 2.2;
  spawnRing(jelly.x, jelly.z, 0.42, 0.15, 0, 0xc8fff4);
  audio.drip();
  toast("水母轻轻收缩，顺着水流漂开");
}

function findNearestRay(px, py) {
  let best = null;
  let bestD = 72;
  for (let i = 0; i < rays.length; i++) {
    const r = rays[i];
    const p = worldToScreen(r.x, r.z);
    const d = Math.hypot(p.x - px, p.y - py);
    if (d < bestD) { bestD = d; best = r; }
  }
  return best;
}
function findNearestJelly(px, py) {
  let best = null;
  let bestD = 58;
  for (let i = 0; i < jellies.length; i++) {
    const j = jellies[i];
    const p = worldToScreen(j.x, j.z);
    const d = Math.hypot(p.x - px, p.y - py);
    if (d < bestD) { bestD = d; best = j; }
  }
  return best;
}

/* ------------------------------------------------------------------ *
 * Initial residents
 * ------------------------------------------------------------------ */

function pointFraction(fx, z) {
  const x = CAM_LEFT + viewWidth * fx;
  return nearestWater(x, z);
}
function seedResidents() {
  const manta = pointFraction(0.55, -1.4);
  createRay(speciesById.manta, manta.x, manta.z, { spawn: false });
  const eagle = pointFraction(0.76, 3.7);
  createRay(speciesById.eagle, eagle.x, eagle.z, { spawn: false });
  const sting1 = pointFraction(0.44, 1.1);
  createRay(speciesById.stingray, sting1.x, sting1.z, { spawn: false });
  const sting2 = pointFraction(0.66, 4.9);
  createRay(speciesById.stingray, sting2.x, sting2.z, { spawn: false });

  const moon1 = pointFraction(0.47, -4.4);
  createJelly(speciesById.moon, moon1.x, moon1.z, { spawn: false });
  const moon2 = pointFraction(0.72, 1.8);
  createJelly(speciesById.moon, moon2.x, moon2.z, { spawn: false });
  const moon3 = pointFraction(0.86, 5.1);
  createJelly(speciesById.moon, moon3.x, moon3.z, { spawn: false });
  const nettle1 = pointFraction(0.59, 4.2);
  createJelly(speciesById.nettle, nettle1.x, nettle1.z, { spawn: false });
  const nettle2 = pointFraction(0.83, 0.8);
  createJelly(speciesById.nettle, nettle2.x, nettle2.z, { spawn: false });
  updateCounts();
}

/* ------------------------------------------------------------------ *
 * Rain, whirlpool, UI state and input
 * ------------------------------------------------------------------ */

function setPressed(action, on) {
  const button = document.querySelector('.toolbar button[data-action="' + action + '"]');
  if (button) button.setAttribute("aria-pressed", on ? "true" : "false");
}
function cycleRain() {
  state.rain = !state.rain;
  state.rainTarget = state.rain ? 1 : 0;
  document.body.classList.toggle("is-raining", state.rain);
  setPressed("rain", state.rain);
  toast(state.rain ? "阵雨落下 · 海面开始起皱" : "雨停了 · 水面重新亮起来");
  if (state.rain) audio.plink(520);
}
function ensureWhirlVisible() {
  const existing = worldToScreen(state.pool.x, state.pool.z);
  if (existing.x < 40 || existing.x > window.innerWidth - 40 || existing.y < 70 || existing.y > window.innerHeight - 70) {
    const q = randomWaterPoint(4, -2.2, 2.2);
    state.pool.set(q.x, 1.4, q.z);
  }
}
function cycleWhirl() {
  state.whirl = !state.whirl;
  state.whirlTarget = state.whirl ? 1 : 0;
  if (state.whirl) {
    ensureWhirlVisible();
    vortexMesh.visible = true;
    vortexMesh.position.set(state.pool.x, 0.09, state.pool.z);
    toast("旋涡已出现 · 拖动水面可以移动它");
  } else {
    toast("旋涡收拢，水面重新平静");
  }
  setPressed("whirl", state.whirl);
}
function cycleCalm() {
  state.calm = !state.calm;
  state.calmTarget = state.calm ? 1 : 0;
  setPressed("calm", state.calm);
  toast(state.calm ? "风停了 · 长涌慢了下来" : "风又吹过海面");
}
function cycleClear() {
  state.clear = !state.clear;
  state.clearTarget = state.clear ? 1 : 0;
  setPressed("clear", state.clear);
  toast(state.clear ? "海水澄澈 · 能看见更远的海底" : "潮水带回一点绿意");
}
function cycleSound() {
  if (audio.failed) {
    toast("这个浏览器暂时没有可用的声音输出");
    return;
  }
  state.sound = !state.sound;
  audio.setEnabled(state.sound);
  setPressed("sound", state.sound);
  if (state.sound) {
    toast("声音已开启 · 浪声跟着涌潮起伏");
    audio.plink(640);
  } else {
    toast("声音已关闭");
  }
}
function toggleUI(force) {
  state.hidden = force == null ? !state.hidden : force;
  document.body.classList.toggle("ui-hidden", state.hidden);
  if (state.hidden) {
    toast("界面已收起 · 按 H 或右下角圆点恢复", 2200);
    window.setTimeout(() => {
      if (state.hidden) toastEl.classList.remove("show");
    }, 1700);
  }
}
function action(name) {
  if (name === "rain") cycleRain();
  else if (name === "whirl") cycleWhirl();
  else if (name === "calm") cycleCalm();
  else if (name === "clear") cycleClear();
  else if (name === "sound") cycleSound();
  else if (name === "hide") toggleUI(true);
}
document.querySelectorAll(".toolbar button[data-action]").forEach((button) => {
  button.addEventListener("click", () => action(button.dataset.action));
});
byId("show-ui").addEventListener("click", () => toggleUI(false));
window.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const target = event.target;
  if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable)) return;
  const key = event.key.toLowerCase();
  if (key === "r") { event.preventDefault(); cycleRain(); }
  else if (key === "w") { event.preventDefault(); cycleWhirl(); }
  else if (key === "c") { event.preventDefault(); cycleCalm(); }
  else if (key === "m") { event.preventDefault(); cycleClear(); }
  else if (key === "h") { event.preventDefault(); toggleUI(); }
  else if (key === "s") { event.preventDefault(); cycleSound(); }
  else if (key === "escape" && state.hidden) { event.preventDefault(); toggleUI(false); }
});

let poolDrag = false;
canvas.addEventListener("pointerdown", (event) => {
  if (event.button != null && event.button !== 0) return;
  if (state.whirl) {
    const p = screenToWorld(event.clientX, event.clientY);
    const q = nearestWater(clamp(p.x, CAM_LEFT + 1.2, viewRight - 1.2), clamp(p.z, topZ + 1.2, bottomZ - 1.2));
    state.pool.x = q.x;
    state.pool.z = q.z;
    poolDrag = true;
    canvas.setPointerCapture && canvas.setPointerCapture(event.pointerId);
    return;
  }
  const p = screenToWorld(event.clientX, event.clientY);
  const ray = findNearestRay(event.clientX, event.clientY);
  if (ray) {
    startleRay(ray, p.x, p.z);
    return;
  }
  const jelly = findNearestJelly(event.clientX, event.clientY);
  if (jelly) {
    startleJelly(jelly, p.x, p.z);
    return;
  }
  if (isWater(p.x, p.z)) {
    addRipple((p.x - CAM_LEFT) / viewWidth, (9 - p.z) / 18, 0.42);
    spawnRing(p.x, p.z, rr(0.26, 0.52), 0.24, 0, 0xd7fff3);
    audio.plink(510 + rr(0, 240));
  }
});
canvas.addEventListener("pointermove", (event) => {
  if (!poolDrag) return;
  const p = screenToWorld(event.clientX, event.clientY);
  const q = nearestWater(clamp(p.x, CAM_LEFT + 1.2, viewRight - 1.2), clamp(p.z, topZ + 1.2, bottomZ - 1.2));
  state.pool.x = q.x;
  state.pool.z = q.z;
});
window.addEventListener("pointerup", () => { poolDrag = false; });
window.addEventListener("pointercancel", () => { poolDrag = false; });

/* ------------------------------------------------------------------ *
 * Resize, quality and render loop
 * ------------------------------------------------------------------ */

function applyResolution() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  state.dpr = clamp(state.dpr, 1, state.dprCap);
  renderer.setPixelRatio(state.dpr);
  renderer.setSize(w, h, false);
  viewWidth = Math.max(7.2, 18 * (w / h));
  viewRight = CAM_LEFT + viewWidth;
  camera.left = CAM_LEFT;
  camera.right = viewRight;
  camera.top = CAM_TOP;
  camera.bottom = CAM_BOTTOM;
  camera.position.x = 0;
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
  shoreUniforms.uShoreRadius.value = shoreRadiusForWidth(viewWidth);
  waterUniforms.uView.value.set(CAM_LEFT, viewRight, topZ, bottomZ);
  waterUniforms.uResolution.value.set(w * state.dpr, h * state.dpr);
  sceneRT.setSize(Math.max(2, Math.floor(w * state.dpr)), Math.max(2, Math.floor(h * state.dpr)));
  splashParticles.mat.uniforms.uPixelRatio.value = state.dpr;
  siltParticles.mat.uniforms.uPixelRatio.value = state.dpr;
}
window.addEventListener("resize", applyResolution);
window.addEventListener("orientationchange", () => window.setTimeout(applyResolution, 180));

let fpsTime = 0;
let fpsFrames = 0;
function monitorQuality(dt) {
  fpsTime += dt;
  fpsFrames++;
  if (fpsTime < 2.6) return;
  const fps = fpsFrames / fpsTime;
  fpsTime = 0;
  fpsFrames = 0;
  if (fps < 40 && state.dpr > 1.01) {
    state.dpr = Math.max(1, state.dpr - 0.16);
    applyResolution();
    if (!state.qualityNoticed) {
      state.qualityNoticed = true;
      toast("画质已自动调低 · 保持海面流畅", 2200);
    }
  }
}

let lastFrame = 0;
let palmClock = 0;
function animate(now) {
  requestAnimationFrame(animate);
  if (!lastFrame) lastFrame = now;
  const rawDt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (document.hidden) return;
  const dt = clamp(rawDt, 0.001, 0.05);
  state.time += dt * (reducedMotion ? 0.62 : 1);

  state.rainAmount = damp(state.rainAmount == null ? 0 : state.rainAmount, state.rain ? 1 : 0, 2.1, dt);
  state.whirlAmount = damp(state.whirlAmount == null ? 0 : state.whirlAmount, state.whirl ? 1 : 0, 2.6, dt);
  state.calmAmount = damp(state.calmAmount == null ? 0 : state.calmAmount, state.calm ? 1 : 0, 1.8, dt);
  state.clearAmount = damp(state.clearAmount == null ? 0 : state.clearAmount, state.clear ? 1 : 0, 1.8, dt);

  updateRippleSim();
  for (let i = 0; i < rays.length; i++) updateRay(rays[i], dt);
  for (let i = 0; i < jellies.length; i++) updateJelly(jellies[i], dt);
  updateHeldVisual(dt);
  updateFlights(dt);

  if (state.rain && state.rainAmount > 0.4 && state.time - state.lastRain > 0.105) {
    state.lastRain = state.time;
    const sx = random();
    const sy = random();
    const wx = CAM_LEFT + sx * viewWidth;
    const wz = topZ + sy * (bottomZ - topZ);
    if (isWater(wx, wz)) {
      addRipple(sx, 1 - sy, 0.1 + random() * 0.15);
      if (random() < 0.18) spawnRing(wx, wz, rr(0.1, 0.26), 0.12, 0, 0xcbfff2);
    }
  }

  splashParticles.update(dt);
  siltParticles.update(dt);
  updateRings(dt);

  palmClock += dt;
  if (palmClock > 0.12) {
    palmClock = 0;
    drawPalmShadow(state.time);
  }

  const swashPhase = state.time * 0.12 + 0.18;
  const swashPulse = clamp(Math.sin((swashPhase % 1) * Math.PI), 0, 1);
  audio.update(swashPulse, state.calmAmount, state.rainAmount);
  if (state.rain && state.rainAmount > 0.6 && random() < dt * 0.5) audio.plink(420 + random() * 280);

  waterUniforms.uTime.value = state.time;
  waterUniforms.uRain.value = state.rainAmount;
  waterUniforms.uCalm.value = state.calmAmount;
  waterUniforms.uClear.value = state.clearAmount;
  waterUniforms.uPool.value.set(state.pool.x, state.pool.z, 3.3, state.whirlAmount);
  waterUniforms.uResolution.value.set(window.innerWidth * state.dpr, window.innerHeight * state.dpr);
  floorUniforms.uTime.value = state.time;
  floorUniforms.uClear.value = state.clearAmount;

  vortexMesh.visible = state.whirlAmount > 0.01;
  vortexMesh.position.set(state.pool.x, 0.09, state.pool.z);
  vortexMesh.scale.setScalar(3.0);
  vortexUniforms.uTime.value = state.time;
  vortexUniforms.uOpacity.value = state.whirlAmount * 0.72;

  waterUniforms.tScene.value = sceneRT.texture;
  waterUniforms.tRipple.value = simA.texture;

  renderer.setRenderTarget(sceneRT);
  renderer.setClearColor(0x062c35, 1);
  renderer.clear(true, true, false);
  renderer.render(worldScene, camera);

  renderer.setRenderTarget(null);
  renderer.setClearColor(0x073f4a, 1);
  renderer.clear(true, true, false);
  renderer.render(waterScene, quadCamera);
  renderer.clearDepth();
  renderer.render(overlayScene, camera);

  monitorQuality(dt);
  if (!state.ready) {
    state.ready = true;
    window.setTimeout(() => {
      loading.classList.add("done");
      window.setTimeout(() => { loading.style.display = "none"; }, 1200);
    }, 380);
  }
}

/* Boot */
buildCards();
seedResidents();
applyResolution();
updateCounts();
window.__shallows = {
  state: state,
  rays: rays,
  jellies: jellies,
  flights: flights,
  camera: camera,
  renderer: renderer,
  worldScene: worldScene,
  overlayScene: overlayScene,
  sceneRT: sceneRT,
  spawn: function (species, x, z) {
    const def = speciesById[species] || speciesById.moon;
    return addCreature(def, x, z, { spawn: true });
  },
  total: totalResidents,
  flashBreach: function () {
    const ray = rays.find((r) => r.def.index === 0);
    if (ray) ray.breach = { t: 0, dur: 2.4 };
  },
};
requestAnimationFrame(animate);




})();
</script>
