<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04232b" />
<meta name="description" content="浅海：从正上方俯瞰一片热带珊瑚礁浅海，把鳐鱼与水母放回海中，听浪、看光。" />
<title>浅海 · Ocean Shallows</title>
<style>
:root{
  --paper:#f6f1df;
  --paper-dim:rgba(246,241,223,.68);
  --paper-faint:rgba(246,241,223,.42);
  --mint:#a9f5df;
  --mint-deep:#39cbb8;
  --ink:#03222b;
  --glass:rgba(233,255,248,.10);
  --glass-strong:rgba(233,255,248,.17);
  --line:rgba(232,255,249,.26);
  --line-soft:rgba(232,255,249,.13);
  --shadow:0 28px 80px rgba(0,18,25,.42);
  --display:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#04232b;color:var(--paper)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
canvas{display:block}
::selection{background:rgba(120,244,214,.35);color:#fff}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid rgba(196,255,238,.9);outline-offset:3px}

#sea{position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none;background:#0b6370}
.vignette,.grain,.rain-layer{position:fixed;inset:0;pointer-events:none}
.vignette{z-index:1;background:
  radial-gradient(120% 85% at 48% 42%,transparent 46%,rgba(1,21,27,.07) 76%,rgba(0,14,20,.23) 100%),
  linear-gradient(180deg,rgba(2,27,34,.12),transparent 24% 78%,rgba(1,18,24,.20))}
.grain{z-index:2;opacity:.055;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/></svg>")}
.rain-layer{z-index:2;opacity:0;transition:opacity 1.1s ease;background-image:repeating-linear-gradient(104deg,transparent 0 27px,rgba(210,255,248,.14) 28px,transparent 30px 58px);background-size:116px 118px;animation:rainfall .52s linear infinite;filter:blur(.35px)}
body.is-raining .rain-layer{opacity:.52}
@keyframes rainfall{from{transform:translate3d(0,-118px,0)}to{transform:translate3d(-116px,0,0)}}

.brand{position:fixed;top:25px;left:27px;z-index:8;display:flex;align-items:center;gap:9px;padding:9px 13px 8px;border:1px solid var(--line-soft);border-radius:99px;background:rgba(5,44,54,.18);backdrop-filter:blur(14px) saturate(1.15);font-size:9px;letter-spacing:.2em;color:var(--paper-dim);transition:opacity .45s ease,transform .45s ease}
.brand i{width:18px;height:18px;border:1px solid rgba(200,255,241,.44);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--mint)}
.brand b{font-weight:400;letter-spacing:.26em;color:var(--paper)}
.brand span{color:var(--paper-faint);letter-spacing:.16em}

.masthead{position:fixed;top:34px;right:38px;z-index:7;text-align:right;max-width:min(370px,34vw);pointer-events:none;text-shadow:0 2px 30px rgba(0,26,34,.22);transition:opacity .45s ease,transform .45s ease}
.masthead .kicker{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin:0 0 13px;font-size:9px;letter-spacing:.33em;color:rgba(238,255,248,.76)}
.masthead .kicker::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,255,240,.65))}
.masthead h1{margin:0;font-family:var(--display);font-size:clamp(58px,7.4vw,108px);font-weight:400;line-height:.83;letter-spacing:.055em;color:#fbf7e9}
.masthead h1 em{display:block;margin-top:14px;font:italic 400 clamp(10px,1vw,12px)/1.4 Georgia,"Times New Roman",serif;letter-spacing:.24em;color:rgba(223,255,247,.72)}
.masthead .lede{margin:20px 0 0 auto;max-width:300px;font-size:11px;line-height:2;letter-spacing:.08em;color:rgba(240,249,235,.7)}
.masthead .coordinate{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px;padding-top:12px;border-top:1px solid rgba(220,255,244,.2);font-size:8px;letter-spacing:.18em;color:rgba(236,250,238,.55)}
.masthead .coordinate b{font-weight:400;color:rgba(217,255,242,.9)}

.toolbar{position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:9;display:flex;align-items:stretch;gap:3px;padding:5px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(135deg,rgba(231,255,249,.14),rgba(9,58,68,.24));backdrop-filter:blur(25px) saturate(1.35);box-shadow:0 16px 46px rgba(1,23,30,.24),inset 0 1px 0 rgba(255,255,255,.14);transition:opacity .45s ease,transform .45s ease}
.toolbar button{position:relative;min-width:60px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 10px 5px;border:1px solid transparent;border-radius:14px;color:rgba(244,249,235,.66);cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .25s}
.toolbar button:hover{background:rgba(212,255,244,.09);color:var(--paper)}
.toolbar button[aria-pressed="true"]{background:rgba(160,251,224,.15);border-color:rgba(180,255,234,.3);color:#e9fff8;box-shadow:inset 0 0 20px rgba(137,255,223,.07)}
.toolbar button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.toolbar button .label{font-size:8.5px;letter-spacing:.13em;white-space:nowrap}
.toolbar kbd{position:absolute;right:5px;top:4px;font:7px/1 Georgia,serif;color:rgba(232,255,245,.4);letter-spacing:0}
.toolbar .sep{width:1px;align-self:center;height:28px;background:rgba(219,255,243,.14);margin:0 2px}

.creature-stats{position:fixed;left:34px;bottom:225px;z-index:7;min-width:170px;padding:11px 17px 12px 18px;border-left:1px solid rgba(195,255,239,.45);background:linear-gradient(90deg,rgba(4,42,51,.36),rgba(4,42,51,.06));backdrop-filter:blur(12px);text-shadow:0 2px 18px rgba(0,20,25,.4);pointer-events:none;transition:opacity .45s ease,transform .45s ease}
.creature-stats .stat-label{margin:0 0 7px;font-size:7.5px;letter-spacing:.32em;color:rgba(221,255,245,.55)}
.creature-stats .stat-line{display:flex;align-items:baseline;gap:7px;font-family:var(--display);color:rgba(243,249,235,.82);font-size:13px;letter-spacing:.05em;white-space:nowrap}
.creature-stats .stat-line b{font:400 25px/1 var(--display);color:#fbf7e9;letter-spacing:.01em}
.creature-stats .stat-line i{font-style:normal;color:rgba(218,255,244,.36)}
.creature-stats .stat-cap{margin:7px 0 0;font-size:7.5px;letter-spacing:.18em;color:rgba(219,255,244,.43)}

.dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;width:min(1128px,calc(100vw - 62px));padding:14px 15px 11px;border:1px solid rgba(223,255,247,.3);border-radius:21px;background:linear-gradient(132deg,rgba(232,255,248,.16),rgba(7,52,62,.35) 52%,rgba(4,41,53,.5));backdrop-filter:blur(28px) saturate(1.28);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,35,45,.18);transition:opacity .45s ease,transform .45s ease}
.dock::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.12),transparent 23% 76%,rgba(189,255,238,.06));mask:linear-gradient(#000,transparent 60%)}
.dock-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:0 5px 9px;position:relative;z-index:1}
.dock-head p{margin:0;display:flex;align-items:center;gap:8px;font-size:8px;letter-spacing:.19em;color:rgba(235,250,238,.58)}
.dock-head p::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px rgba(151,255,223,.7)}
.dock-head strong{color:rgba(246,249,235,.9);font-weight:400;letter-spacing:.12em}
.dock-head .capacity{font-size:8px;letter-spacing:.16em;color:rgba(228,255,245,.45)}
.dock-head .capacity b{font-weight:400;color:rgba(245,255,248,.82)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;position:relative;z-index:1}
.card{position:relative;height:105px;overflow:hidden;border:1px solid rgba(227,255,247,.19);border-radius:13px;background:linear-gradient(155deg,rgba(189,255,239,.08),rgba(1,34,46,.24));cursor:grab;text-align:left;transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s,background .28s,box-shadow .28s;touch-action:none;isolation:isolate}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.16),transparent 28% 72%,rgba(143,255,228,.05));opacity:.7}
.card:hover{transform:translateY(-4px);border-color:rgba(194,255,238,.5);background:linear-gradient(155deg,rgba(197,255,241,.15),rgba(3,43,55,.3));box-shadow:0 12px 30px rgba(0,20,27,.28)}
.card:active{cursor:grabbing;transform:translateY(-4px) scale(.985)}
.card canvas{position:absolute;inset:2px 2px 25px;width:calc(100% - 4px);height:calc(100% - 27px);filter:drop-shadow(0 4px 8px rgba(0,27,36,.2))}
.card .num{position:absolute;top:8px;left:9px;z-index:2;font:7px/1 Georgia,serif;letter-spacing:.12em;color:rgba(231,255,246,.52)}
.card .tag{position:absolute;top:7px;right:7px;z-index:2;padding:3px 5px 2px;border:1px solid rgba(218,255,243,.21);border-radius:99px;background:rgba(4,38,47,.22);font-size:6.5px;letter-spacing:.14em;color:rgba(224,255,245,.56)}
.card .copy{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:4px;padding:8px 9px 7px;background:linear-gradient(transparent,rgba(1,28,38,.78))}
.card .copy b{font-size:11px;font-weight:400;letter-spacing:.1em;color:#f8f3e3;white-space:nowrap}
.card .copy small{font:italic 7px/1 Georgia,serif;letter-spacing:.07em;color:rgba(226,255,246,.47);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.is-spawning{animation:cardPulse .6s ease}
@keyframes cardPulse{0%{border-color:rgba(183,255,234,.9);box-shadow:0 0 0 0 rgba(160,255,226,.25)}100%{border-color:rgba(227,255,247,.19);box-shadow:0 0 0 18px rgba(160,255,226,0)}}

.hint{position:fixed;left:50%;bottom:216px;z-index:6;transform:translateX(-50%);margin:0;display:flex;align-items:center;gap:8px;font-size:8px;letter-spacing:.17em;color:rgba(235,251,240,.5);pointer-events:none;transition:opacity .5s;text-shadow:0 2px 16px rgba(0,20,27,.5)}
.hint i{font-style:normal;color:rgba(181,255,233,.8)}
.toast{position:fixed;left:50%;bottom:168px;z-index:20;transform:translate(-50%,10px);padding:10px 16px;border:1px solid rgba(216,255,244,.26);border-radius:99px;background:rgba(4,43,53,.7);backdrop-filter:blur(18px);box-shadow:0 12px 36px rgba(0,17,23,.3);font-size:10px;letter-spacing:.12em;color:rgba(246,252,239,.9);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;white-space:nowrap;max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.show-ui{position:fixed;right:22px;bottom:22px;z-index:18;width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:rgba(7,47,57,.62);backdrop-filter:blur(15px);color:var(--mint);font-size:18px;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .4s,transform .4s,visibility .4s;cursor:pointer}
body.ui-hidden .brand,body.ui-hidden .masthead,body.ui-hidden .toolbar,body.ui-hidden .creature-stats,body.ui-hidden .dock,body.ui-hidden .hint{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transform:translateY(10px)}
body.ui-hidden .show-ui{opacity:1;visibility:visible;transform:none}

.loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#0c5660,#031d27 64%);transition:opacity .9s ease,visibility .9s ease;overflow:hidden}
.loading::after{content:"";position:absolute;width:60vmax;height:60vmax;border:1px solid rgba(177,255,233,.1);border-radius:50%;box-shadow:0 0 0 18vmax rgba(177,255,233,.025),0 0 0 36vmax rgba(177,255,233,.018);animation:breathe 5s ease-in-out infinite}
.loading .load-copy{position:relative;z-index:1;text-align:center;color:rgba(244,251,238,.85)}
.loading .load-copy span{display:block;margin-bottom:16px;font:7px/1.4 Georgia,serif;letter-spacing:.35em;color:rgba(211,255,243,.5)}
.loading .load-copy b{display:block;font-family:var(--display);font-size:clamp(36px,5vw,58px);font-weight:400;letter-spacing:.18em}
.loading .load-copy i{display:block;margin-top:18px;font-style:normal;font-size:9px;letter-spacing:.3em;color:rgba(195,255,237,.45)}
.loading.done{opacity:0;visibility:hidden;pointer-events:none}
@keyframes breathe{50%{transform:scale(1.035);opacity:.75}}

@media (max-width:900px){
  .brand{top:14px;left:14px;padding:7px 10px;font-size:8px}
  .brand span{display:none}
  .masthead{top:18px;right:16px;max-width:50vw}
  .masthead .kicker{font-size:7px;margin-bottom:9px;letter-spacing:.22em}
  .masthead h1{font-size:clamp(40px,12vw,62px)}
  .masthead h1 em{margin-top:8px;font-size:7px;letter-spacing:.17em}
  .masthead .lede,.masthead .coordinate{display:none}
  .toolbar{top:auto;bottom:156px;left:12px;right:12px;transform:none;overflow-x:auto;justify-content:flex-start;gap:1px;padding:4px;border-radius:15px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar button{min-width:50px;height:43px;padding:3px 7px;gap:2px;flex:0 0 auto}
  .toolbar button svg{width:15px;height:15px}
  .toolbar button .label{font-size:7.5px;letter-spacing:.06em}
  .toolbar kbd{display:none}
  .toolbar .sep{height:22px;margin:0}
  .creature-stats{top:61px;bottom:auto;left:14px;padding:7px 11px 8px 12px;min-width:0;background:rgba(4,42,51,.2);border-left-color:rgba(195,255,239,.3)}
  .creature-stats .stat-label{margin-bottom:4px;font-size:6.5px}
  .creature-stats .stat-line{font-size:10px;gap:5px}
  .creature-stats .stat-line b{font-size:18px}
  .creature-stats .stat-cap{display:none}
  .dock{bottom:7px;width:calc(100vw - 14px);padding:8px 8px 7px;border-radius:16px}
  .dock-head{margin:0 3px 6px;gap:8px}
  .dock-head p{font-size:6.5px;letter-spacing:.11em}
  .dock-head p::before{width:4px;height:4px}
  .dock-head .capacity{font-size:6.5px;letter-spacing:.08em;white-space:nowrap}
  .cards{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:1px}
  .cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 118px;height:86px;scroll-snap-align:start;border-radius:11px}
  .card canvas{inset:2px 2px 21px;width:calc(100% - 4px);height:calc(100% - 23px)}
  .card .copy{padding:6px 7px 5px}
  .card .copy b{font-size:9.5px}
  .card .copy small{display:none}
  .card .tag{font-size:6px;padding:2px 4px}
  .hint{bottom:140px;font-size:7px;letter-spacing:.1em;width:100%;justify-content:center}
  .toast{bottom:157px;font-size:9px}
  .show-ui{right:14px;bottom:14px;width:42px;height:42px}
}
@media (max-height:560px){
  .masthead .lede,.masthead .coordinate{display:none}
  .toolbar{bottom:142px}
  .creature-stats{opacity:.82}
  .dock{height:132px}
  .card{height:76px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .rain-layer{animation:none}
  .loading::after{animation:none}
  *{scroll-behavior:auto!important}
}
@media (max-width:640px){
  .cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;overflow:visible;scroll-snap-type:none;padding-bottom:0}
  .card{width:auto;min-width:0;height:84px;flex:none;border-radius:9px}
  .card canvas{inset:1px 1px 20px;width:calc(100% - 2px);height:calc(100% - 21px)}
  .card .copy{padding:4px 4px 3px;gap:0}
  .card .copy b{font-size:8.5px;letter-spacing:0;line-height:1.2}
  .card .copy small{display:none}
  .card .tag{display:none}
  .card .num{top:3px;left:3px;font-size:5px}
  .dock-head p{font-size:5.7px;letter-spacing:.04em;gap:5px}
  .dock-head .capacity{font-size:5.8px;letter-spacing:.04em}
  .dock-head{margin:0 2px 5px}
  .hint{bottom:138px}
}
</style>
</head>
<body>
<canvas id="sea" aria-label="浅海俯视图：沙滩、珊瑚礁、鳐鱼和水母"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="rain-layer" id="rain-layer" aria-hidden="true"></div>

<a class="brand" href="./#games" aria-label="返回深海游乐场"><i>≋</i><b>深海</b><span>/ 浅海观察</span></a>

<header class="masthead" aria-labelledby="page-title">
  <p class="kicker">01 / 珊瑚礁边缘 · 0–8 M</p>
  <h1 id="page-title">浅海<em>OCEAN SHALLOWS</em></h1>
  <p class="lede">阳光落进不到十米深的海。白沙、海草与珊瑚之间，鳐鱼掠过自己的影子，水母像一小口呼吸，慢慢漂远。</p>
  <p class="coordinate"><span>28° 16′ N</span><b>能见度 18 m</b><span>水温 28°C</span></p>
</header>

<nav class="toolbar" id="toolbar" aria-label="海面控制">
  <button type="button" data-action="rain" aria-pressed="false" title="阵雨（R）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 14.5H6a3.2 3.2 0 0 1-.2-6.4 4.6 4.6 0 0 1 8.9-1.4A3.6 3.6 0 0 1 18.4 13"/><path d="m8.3 17.2-1 3.2M12.3 17.2l-1 3.2M16.3 17.2l-1 3.2"/></svg>
    <span class="label">阵雨</span><kbd>R</kbd>
  </button>
  <button type="button" data-action="whirl" aria-pressed="false" title="旋涡（W），开启后拖动水面移动">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 10.1c-.6-4-4.2-6.6-8.2-6.2-3.8.4-6.6 3.4-6.4 7 .1 3.2 2.7 5.6 5.8 5.6 2.6 0 4.6-1.8 4.7-4.1.1-2.1-1.5-3.7-3.5-3.7-1.7 0-3 1.2-3 2.7 0 1.3 1 2.3 2.3 2.3"/></svg>
    <span class="label">旋涡</span><kbd>W</kbd>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-action="calm" aria-pressed="false" title="静海（C）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5c3.2 0 3.2-1.4 6.4-1.4S12.6 9.5 15.8 9.5 19 8.1 21 8.1M3 14.2c3.2 0 3.2-1.1 6.4-1.1s3.2 1.1 6.4 1.1 3.1-1.1 5.2-1.1M3 18.6h11.8"/></svg>
    <span class="label">静海</span><kbd>C</kbd>
  </button>
  <button type="button" data-action="clear" aria-pressed="false" title="澄澈海水（M）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2v3M12 17.8v3M3.2 12h3M17.8 12h3M5.8 5.8l2.1 2.1M16.1 16.1l2.1 2.1M18.2 5.8l-2.1 2.1M7.9 16.1l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
    <span class="label">澄澈</span><kbd>M</kbd>
  </button>
  <button type="button" data-action="sound" aria-pressed="false" title="海浪声音（S）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3.2L12 18V6L7.2 10H4Z"/><path d="M15.5 9.1a4.2 4.2 0 0 1 0 5.8M18.2 6.8a7.6 7.6 0 0 1 0 10.4"/></svg>
    <span class="label">声音</span><kbd>S</kbd>
  </button>

<script id="glsl-noise" type="x-shader/x-fragment">
float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++){
    v += a * vnoise(p);
    p = p * 2.03 + vec2(9.7, 3.1);
    a *= 0.5;
  }
  return v;
}
</script>
<script id="glsl-shore" type="x-shader/x-fragment">
uniform vec2 uShoreCenter;
uniform float uShoreRadius;
float shoreDist(vec2 p){
  vec2 q = p - uShoreCenter;
  float ang = atan(q.y, q.x);
  float r = length(q * vec2(1.0, 0.94));
  float wobble = 0.22 * sin(ang * 5.0 + 0.8) + 0.12 * sin(ang * 9.0 - 1.3) + 0.06 * sin(ang * 15.0 + 2.2);
  return r - (uShoreRadius + wobble);
}
</script>
<script id="sim-frag" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D tState;
uniform vec2 uTexel;
uniform float uTime;
uniform vec4 uRipples[8];
varying vec2 vUv;

void main(){
  vec4 state = texture2D(tState, vUv);
  float h = state.r * 2.0 - 1.0;
  float prev = state.g * 2.0 - 1.0;

  float hl = texture2D(tState, vUv - vec2(uTexel.x, 0.0)).r * 2.0 - 1.0;
  float hr = texture2D(tState, vUv + vec2(uTexel.x, 0.0)).r * 2.0 - 1.0;
  float hu = texture2D(tState, vUv + vec2(0.0, uTexel.y)).r * 2.0 - 1.0;
  float hd = texture2D(tState, vUv - vec2(0.0, uTexel.y)).r * 2.0 - 1.0;
  float laplacian = hl + hr + hu + hd - 4.0 * h;

  float next = 2.0 * h - prev + 0.265 * laplacian;
  next *= 0.994;

  float edge = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
  next *= mix(0.30, 1.0, smoothstep(0.0, 0.115, edge));

  for (int i = 0; i < 8; i++){
    vec4 r = uRipples[i];
    float age = uTime - r.z;
    if (age > 0.0 && age < 0.13){
      vec2 delta = vUv - r.xy;
      float g = exp(-dot(delta, delta) * 13500.0);
      next += sin(age * 92.0) * g * r.w;
    }
  }

  next = clamp(next, -1.0, 1.0);
  gl_FragColor = vec4(next * 0.5 + 0.5, h * 0.5 + 0.5, 0.0, 1.0);
}
</script>
<script id="floor-frag" type="x-shader/x-fragment">
precision highp float;
uniform float uTime;
uniform float uClear;
varying vec3 vWorld;
varying vec2 vUv;

void main(){
  vec2 p = vWorld.xz;
  float d = shoreDist(p);
  float sea = smoothstep(-0.12, 0.14, d);
  float depth = clamp(d / 17.0, 0.0, 1.0);

  float broad = fbm(p * 0.19 + vec2(1.7, -0.4));
  float fine = hash21(floor(p * 105.0));
  float ripple = sin((p.x * 1.35 + p.y * 0.48) * 3.2 + 2.2 * fbm(p * 0.5));
  float beachGrain = vnoise(p * 62.0);

  vec3 dry = mix(vec3(0.72, 0.63, 0.44), vec3(0.96, 0.86, 0.63), broad);
  dry = mix(dry, vec3(0.84, 0.72, 0.51), 0.28 + 0.22 * ripple);
  dry *= 0.91 + 0.17 * fine;
  dry *= 0.96 + 0.04 * beachGrain;

  vec3 submerged = mix(vec3(0.72, 0.65, 0.47), vec3(0.34, 0.40, 0.35), smoothstep(0.0, 1.0, depth));
  submerged *= 0.84 + 0.19 * ripple;
  submerged = mix(submerged, vec3(0.47, 0.47, 0.33), smoothstep(0.25, 0.92, ripple) * 0.14);
  submerged *= 0.93 + 0.12 * fine;

  float meadow = smoothstep(0.48, 0.72, fbm(p * 0.34 + vec2(5.0, -2.0)));
  submerged = mix(submerged, vec3(0.19, 0.31, 0.20), meadow * (1.0 - smoothstep(0.4, 0.9, depth)) * 0.55);

  vec3 col = mix(dry, submerged, sea);

  float wet = (1.0 - smoothstep(0.0, 3.05, -d)) * (1.0 - sea);
  col = mix(col, col * vec3(0.55, 0.60, 0.55), wet * 0.7);
  col += wet * vec3(0.10, 0.14, 0.12) * (0.35 + 0.65 * vnoise(p * 14.0));

  float shell = step(0.9965, hash21(floor(p * 32.0))) * (1.0 - sea);
  col = mix(col, vec3(0.94, 0.88, 0.74), shell * 0.7);

  float pebble = step(0.9935, hash21(floor(p * 18.0 + 8.0))) * sea;
  col = mix(col, vec3(0.34, 0.36, 0.31), pebble * 0.48);

  col += vec3(0.02, 0.035, 0.032) * smoothstep(0.4, 1.0, depth);
  col = mix(col, col * vec3(0.86, 0.94, 0.96), uClear * 0.18);

  gl_FragColor = vec4(col, 1.0);
}
</script>
<script id="water-frag" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D tScene;
uniform sampler2D tRipple;
uniform vec2 uResolution;
uniform vec4 uView;
uniform vec2 uSimTexel;
uniform float uTime;
uniform float uRain;
uniform float uCalm;
uniform float uClear;
uniform vec4 uPool;
varying vec2 vUv;

float caustic(vec2 p, float t){
  vec2 q = p * 2.05;
  float a = sin(q.x * 1.55 + sin(q.y * 1.2 + t * 0.73) * 1.65 + t * 0.6);
  float b = sin(q.y * 1.38 + sin(q.x * 1.1 - t * 0.55) * 1.8 - t * 0.45);
  float c = abs(a + b);
  return pow(1.0 - clamp(c * 0.52, 0.0, 1.0), 10.0);
}

void main(){
  vec2 uv = vUv;
  vec2 texel = uSimTexel;
  vec3 scene = texture2D(tScene, uv).rgb;

  float heightL = texture2D(tRipple, uv - vec2(texel.x, 0.0)).r - 0.5;
  float heightR = texture2D(tRipple, uv + vec2(texel.x, 0.0)).r - 0.5;
  float heightD = texture2D(tRipple, uv - vec2(0.0, texel.y)).r - 0.5;
  float heightU = texture2D(tRipple, uv + vec2(0.0, texel.y)).r - 0.5;
  vec2 rippleGrad = vec2(heightR - heightL, heightU - heightD);

  float worldX = mix(uView.x, uView.y, uv.x);
  float worldZ = mix(uView.w, uView.z, uv.y);
  vec2 p = vec2(worldX, worldZ);
  float d = shoreDist(p);
  float waterMask = smoothstep(-0.12, 0.17, d);
  float depth = clamp(d / 24.0, 0.0, 1.0);
  float shallow = 1.0 - smoothstep(0.05, 8.0, d);

  vec2 swellDir = normalize(vec2(-0.58, -0.82));
  float swellPhase = dot(p, swellDir) * 1.35 - uTime * 1.15;
  float swell = sin(swellPhase) * 0.5 + 0.5;
  float crossSwell = sin(dot(p, vec2(0.82, -0.42)) * 3.3 + uTime * 1.9) * 0.5 + 0.5;
  float calm = mix(1.0, 0.28, uCalm);
  float waveAmp = mix(1.0, 0.45, uClear) * calm;

  vec2 normal = vec2(0.0);
  normal += swellDir * cos(swellPhase) * 0.042 * waveAmp;
  normal += vec2(0.75, -0.34) * cos(dot(p, vec2(0.75, -0.34)) * 4.7 + uTime * 2.2) * 0.012 * waveAmp;
  normal += rippleGrad * 23.0;
  normal += vec2(
    sin(p.x * 7.1 + p.y * 2.3 - uTime * 3.1),
    cos(p.y * 6.4 - p.x * 1.7 + uTime * 2.6)
  ) * 0.0022 * waveAmp;

  float edge = smoothstep(0.0, 0.075, min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y)));
  normal *= mix(0.35, 1.0, edge);

  vec2 refract = normal * (0.006 + depth * 0.024) * waterMask;
  refract.x *= uResolution.y / max(uResolution.x, 1.0);
  vec2 sampleUv = clamp(uv + refract, vec2(0.001), vec2(0.999));
  vec3 refracted;
  refracted.r = texture2D(tScene, sampleUv).r;
  refracted.g = texture2D(tScene, sampleUv + refract * 0.018).g;
  refracted.b = texture2D(tScene, sampleUv - refract * 0.018).b;

  vec3 turquoise = vec3(0.36, 1.0, 0.88);
  vec3 lagoon = vec3(0.035, 0.70, 0.77);
  vec3 sapphire = vec3(0.012, 0.18, 0.55);
  vec3 deepBlue = vec3(0.005, 0.055, 0.27);
  vec3 body = mix(turquoise, lagoon, smoothstep(0.0, 0.22, depth));
  body = mix(body, sapphire, smoothstep(0.18, 0.64, depth));
  body = mix(body, deepBlue, smoothstep(0.66, 1.0, depth));
  float clarity = mix(0.86, 1.14, uClear);
  vec3 tint = mix(vec3(0.63, 0.99, 0.94), vec3(0.17, 0.45, 0.89), smoothstep(0.0, 0.78, depth));
  tint *= clarity;

  float caust = caustic(p * 1.12, uTime * 0.77) * 0.66 + caustic(p * 1.9 + vec2(5.2, 1.7), uTime * 0.5) * 0.34;
  float caustMask = smoothstep(0.0, 0.22, d) * (1.0 - smoothstep(7.5, 14.0, d));
  caustMask *= mix(0.75, 1.25, uClear);
  refracted += caust * vec3(0.86, 1.0, 0.94) * caustMask * 0.145;

  float waterAlpha = mix(0.18, 0.88, smoothstep(0.0, 12.5, d));
  waterAlpha = mix(waterAlpha, 0.10, shallow * 0.35);
  waterAlpha *= mix(1.0, 0.72, uClear);
  waterAlpha *= waterMask;
  vec3 waterCol = refracted * tint * 0.74 + body * mix(0.55, 0.76, depth);
  waterCol += body * shallow * 0.13;
  waterCol = mix(refracted, waterCol, waterAlpha);

  float crest = smoothstep(0.63, 0.94, swell) * (0.35 + 0.65 * shallow) * calm;
  waterCol += crest * vec3(0.16, 0.42, 0.42) * 0.34;
  float surfaceBand = smoothstep(0.62, 0.96, swell) * (1.0 - smoothstep(0.0, 0.16, depth));
  waterCol += surfaceBand * vec3(0.05, 0.17, 0.17) * 0.42;

  float sparkle = step(0.9936, hash21(floor(uv * uResolution * 0.52) + floor(uTime * 13.0) * 17.0));
  sparkle *= smoothstep(0.0, 0.4, d) * (0.55 + 0.45 * crossSwell);
  sparkle *= mix(0.2, 1.0, uClear) * (1.0 - uRain * 0.8) * (1.0 - uCalm * 0.55);
  waterCol += sparkle * vec3(1.0, 0.95, 0.73) * 0.92;

  float glint = pow(max(0.0, cos(swellPhase + normal.x * 12.0 + normal.y * 10.0) * 0.5 + 0.5), 28.0);
  waterCol += glint * vec3(0.66, 1.0, 0.88) * 0.075 * (1.0 - uRain * 0.6);

  float breakerFront = mod(uTime * 0.52, 5.1);
  float breaker = smoothstep(0.35, 0.0, abs(d - breakerFront));
  breaker *= smoothstep(0.0, 0.7, d) * (1.0 - smoothstep(4.0, 7.0, d));
  float breakerLace = smoothstep(0.50, 0.76, fbm(p * 3.6 + vec2(uTime * 0.11, 0.0)));
  float shoreFoam = smoothstep(0.78, 0.0, d);
  shoreFoam *= smoothstep(0.20, 0.66, fbm(p * 4.2 + vec2(0.0, uTime * 0.16)) + 0.23 * sin(p.x * 12.0 + p.y * 7.0));
  float foam = (breaker * (0.22 + 0.78 * breakerLace) * 0.88 + shoreFoam * 0.6) * waterMask * calm;
  waterCol = mix(waterCol, vec3(0.92, 0.99, 0.95), clamp(foam * 1.0, 0.0, 0.78));

  float cycle = fract(uTime * 0.12 + 0.18);
  float run = sin(cycle * 3.14159265);
  run = smoothstep(0.0, 0.72, run) * (0.5 + 0.5 * sin(uTime * 0.23 + 1.4));
  float reach = 0.25 + run * 2.55;
  float swash = smoothstep(-reach - 0.34, -reach + 0.24, d);
  swash *= 1.0 - smoothstep(-0.12, 0.08, d);
  float swashEdge = exp(-pow((d + reach) / 0.15, 2.0));
  float lace = smoothstep(0.40, 0.72, fbm(p * 5.2 + vec2(uTime * 0.21, -uTime * 0.15)));
  float laceFine = smoothstep(0.55, 0.86, fbm(p * 12.0 + vec2(uTime * 0.3, 0.0)));
  float swashFoam = swash * (0.08 + 0.22 * lace) + swashEdge * (0.35 + 0.65 * lace) * (0.55 + 0.45 * laceFine);
  swashFoam *= (1.0 - uCalm * 0.35);

  float land = 1.0 - waterMask;
  if (land > 0.001) {
    vec3 sand = scene;
    float inland = -d;
    float wet = 1.0 - smoothstep(0.0, 3.5, inland);
    float wetNoise = vnoise(p * 9.0 + vec2(0.0, uTime * 0.01));
    wet *= 0.78 + 0.22 * wetNoise;
    vec3 wetSand = sand * vec3(0.58, 0.63, 0.58);
    wetSand += vec3(0.11, 0.16, 0.14) * wetNoise * 0.5;
    sand = mix(sand, wetSand, wet * 0.62);
    float sheen = pow(max(0.0, 1.0 - abs(d + reach) * 1.1), 6.0);
    float gloss = smoothstep(0.35, 0.95, fbm(p * 7.0 + vec2(uTime * 0.04, 0.0)) + 0.22 * sin(p.x * 8.0 - p.y * 11.0));
    sand += vec3(0.17, 0.25, 0.22) * (sheen * 0.92 + gloss * wet * 0.22);
    sand = mix(sand, vec3(0.93, 0.98, 0.92), clamp(swashFoam, 0.0, 0.92));
    if (uRain > 0.5) {
      float rainRing = step(0.992, hash21(floor(p * 48.0) + floor(uTime * 9.0) * 11.0));
      sand += rainRing * vec3(0.11, 0.15, 0.13);
    }
    waterCol = mix(waterCol, sand, land);
  }

  float poolMask = smoothstep(uPool.z, uPool.z * 0.08, length(p - uPool.xy)) * uPool.w;
  if (poolMask > 0.001) {
    vec2 q = p - uPool.xy;
    float r = length(q);
    float a = atan(q.y, q.x);
    float arms = pow(max(0.0, sin(a * 3.0 + r * 5.5 - uTime * 4.2)), 18.0);
    float inner = smoothstep(uPool.z, 0.0, r);
    waterCol = mix(waterCol, vec3(0.78, 0.98, 0.93), arms * inner * 0.30);
    waterCol += vec3(0.20, 0.50, 0.48) * exp(-r * 1.7) * 0.06;
    waterCol *= 1.0 - exp(-r * 1.6) * 0.20 * inner;
    normal += normalize(q + 0.0001) * sin(a * 4.0 - r * 8.0 + uTime * 3.0) * 0.05 * poolMask;
  }

  float rainDim = 1.0 - uRain * 0.12;
  waterCol *= rainDim;
  waterCol *= 1.0 - 0.16 * pow(clamp(length(uv - 0.5) * 1.25, 0.0, 1.0), 2.0);
  gl_FragColor = vec4(waterCol, 1.0);
}
</script>
<script id="ray-vert" type="x-shader/x-vertex">
attribute float aSide;
uniform float uSpan;
uniform float uLen;
uniform float uTime;
uniform float uPhase;
uniform float uFlap;
uniform float uMode;
varying vec2 vP;
varying float vSide;
varying float vLift;
void main(){
  vP = vec2(position.x / max(uSpan, 0.001), position.z / max(uLen, 0.001));
  vec3 p = position;
  float sx = clamp(abs(position.x) / max(uSpan, 0.001), 0.0, 1.0);
  float wave = sin(uTime * 3.0 - sx * 3.4 + uPhase) * uFlap;
  if (uMode > 0.5) {
    wave = sin(uTime * 3.7 - length(position.xz) * 4.2 + uPhase) * uFlap;
  }
  float bend = wave * pow(sx, 1.55);
  p.y += bend;
  vLift = bend;
  vSide = aSide;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}
</script>
<script id="ray-frag" type="x-shader/x-fragment">
precision highp float;
varying vec2 vP;
varying float vSide;
varying float vLift;
uniform float uTime;

float spotField(vec2 p, float threshold){
  vec2 g = p;
  vec2 id = floor(g);
  vec2 f = fract(g) - 0.5;
  float h = hash21(id);
  return smoothstep(0.17, 0.045, length(f)) * step(threshold, h);
}
float ringField(vec2 p, float threshold){
  vec2 id = floor(p);
  vec2 f = fract(p) - 0.5;
  float h = hash21(id + 7.0);
  return smoothstep(0.045, 0.0, abs(length(f) - 0.28)) * step(threshold, h);
}

void main(){
  vec3 top;
  vec3 bottom;

#if SPECIES == 0
  top = mix(vec3(0.014, 0.024, 0.032), vec3(0.055, 0.09, 0.11), smoothstep(0.08, 0.72, abs(vP.x)));
  float shoulder = smoothstep(0.21, 0.12, length(vec2((abs(vP.x) - 0.43) * 1.17, (vP.y + 0.16) * 1.12)));
  top = mix(top, vec3(0.91, 0.92, 0.85), shoulder * 0.92);
  float eye = smoothstep(0.048, 0.008, length(vec2(abs(vP.x) - 0.33, vP.y + 0.43)));
  top = mix(top, vec3(0.0), eye);
  bottom = vec3(0.87, 0.87, 0.79);
  float bellyDots = spotField(vP * 6.5 + vec2(2.0, 1.0), 0.57);
  bottom = mix(bottom, vec3(0.07, 0.09, 0.09), bellyDots * 0.83);
#elif SPECIES == 1
  top = mix(vec3(0.024, 0.049, 0.054), vec3(0.06, 0.10, 0.10), smoothstep(0.1, 0.8, abs(vP.x)));
  float dots = spotField(vP * 5.1 + vec2(1.0, 3.0), 0.52);
  float rings = ringField(vP * 4.2 + vec2(0.4, 2.1), 0.59);
  top = mix(top, vec3(0.88, 0.90, 0.83), max(dots * 0.86, rings * 0.60));
  bottom = vec3(0.80, 0.82, 0.74);
  bottom = mix(bottom, vec3(0.17, 0.21, 0.19), spotField(vP * 7.0, 0.58) * 0.58);
#else
  top = mix(vec3(0.60, 0.40, 0.22), vec3(0.78, 0.59, 0.35), smoothstep(0.1, 0.85, abs(vP.x)));
  float blue = max(spotField(vP * 6.2 + vec2(4.0, 0.0), 0.47), spotField(vP * 8.8 + vec2(1.0, 5.0), 0.58) * 0.85);
  top = mix(top, vec3(0.01, 0.52, 1.0), blue * 0.98);
  float spiracle = smoothstep(0.09, 0.012, length(vec2(abs(vP.x) - 0.25, vP.y + 0.27)));
  top = mix(top, vec3(0.02, 0.18, 0.26), spiracle * 0.92);
  float eye = smoothstep(0.05, 0.008, length(vec2(abs(vP.x) - 0.16, vP.y + 0.4)));
  top = mix(top, vec3(0.015, 0.02, 0.025), eye);
  top *= 0.95 + 0.05 * sin(vP.x * 13.0 + vP.y * 9.0);
  bottom = vec3(0.83, 0.73, 0.56);
#endif

  vec3 col = vSide > 0.5 ? top : bottom;
  if (vSide > -0.5 && vSide < 0.5) {
    col = vec3(0.035, 0.08, 0.075);
  }
  col *= 1.0 + clamp(vLift * 6.0, -1.0, 1.0) * 0.22;
  float rim = smoothstep(0.84, 1.02, length(vP * vec2(0.96, 0.90)));
  col = mix(col, col * 0.58 + vec3(0.02, 0.05, 0.05), rim * 0.58);
  col += vec3(0.035, 0.07, 0.07) * pow(clamp(1.0 - length(vP) * 0.42, 0.0, 1.0), 4.0);
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script id="jelly-vert" type="x-shader/x-vertex">
varying vec3 vN;
varying vec3 vView;
varying vec3 vLocal;
varying vec2 vUv;
void main(){
  vLocal = position;
  vUv = uv;
  vN = normalize(normalMatrix * normal);
  vec4 world = modelMatrix * vec4(position, 1.0);
  vView = normalize(cameraPosition - world.xyz);
  gl_Position = projectionMatrix * viewMatrix * world;
}

<script id="jelly-frag" type="x-shader/x-fragment">
precision highp float;
uniform float uRadius;
uniform float uTime;
varying vec3 vN;
varying vec3 vView;
varying vec3 vLocal;
varying vec2 vUv;

void main(){
  vec2 p = vLocal.xz / max(uRadius, 0.001);
  float r = length(p);
  float ang = atan(p.y, p.x);
  float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vView))), 2.0);

#if SPECIES == 0
  vec3 col = mix(vec3(0.32, 0.78, 0.80), vec3(0.88, 1.0, 0.95), fres * 1.28);
  float horses = 0.0;
  for (int i = 0; i < 4; i++){
    float a = 0.785398 + float(i) * 1.570796;
    vec2 c = vec2(cos(a), sin(a)) * 0.40;
    float q = length(p - c);
    float arc = smoothstep(0.105, 0.022, abs(q - 0.17));
    float notch = smoothstep(0.22, 0.04, abs(p.x * c.y - p.y * c.x));
    horses = max(horses, arc * (0.38 + 0.62 * notch));
  }
  col = mix(col, vec3(0.99, 0.34, 0.53), horses * 1.0);
  float centerMouth = smoothstep(0.23, 0.04, r);
  col = mix(col, vec3(0.94, 0.99, 0.91), centerMouth * 0.28);
  float canal = smoothstep(0.055, 0.0, abs(sin(ang * 4.0))) * smoothstep(0.97, 0.2, r);
  col = mix(col, vec3(0.83, 0.98, 0.95), canal * 0.38);
  float fringe = smoothstep(0.80, 1.0, r) * (0.34 + 0.66 * step(0.0, sin(ang * 24.0)));
  col = mix(col, vec3(0.92, 0.99, 0.96), fringe * 0.35);
  float alpha = 0.30 + fres * 0.52 + fringe * 0.20 + horses * 0.34;
#else
  vec3 col = mix(vec3(0.80, 0.38, 0.10), vec3(1.0, 0.80, 0.38), fres * 0.94);
  float stripe = pow(0.5 + 0.5 * sin(ang * 16.0 + r * 2.4), 7.0);
  col = mix(col, vec3(0.72, 0.20, 0.12), stripe * 0.55);
  float edge = smoothstep(0.80, 1.0, r);
  col = mix(col, vec3(0.95, 0.59, 0.26), edge * 0.35);
  float alpha = 0.34 + fres * 0.46 + stripe * 0.12;
#endif

  col *= 0.93 + 0.07 * sin(uTime * 0.7 + ang * 3.0);
  if (!gl_FrontFacing) alpha *= 0.55;
  gl_FragColor = vec4(col, clamp(alpha, 0.0, 0.86));
}

<script id="vortex-frag" type="x-shader/x-fragment">
precision highp float;
uniform float uTime;
uniform float uOpacity;
varying vec2 vUv;
void main(){
  vec2 p = (vUv - 0.5) * 2.0;
  float r = length(p);
  if (r > 1.0) discard;
  float a = atan(p.y, p.x);
  float spiral = 0.5 + 0.5 * sin(a * 2.0 + r * 11.0 - uTime * 3.4);
  float lines = smoothstep(0.48, 0.96, spiral) * smoothstep(1.0, 0.18, r);
  float halo = smoothstep(0.05, 0.0, abs(r - 0.76)) * 0.22;
  float center = smoothstep(0.35, 0.02, r);
  vec3 col = mix(vec3(0.60, 0.97, 0.90), vec3(0.96, 1.0, 0.94), lines);
  col = mix(vec3(0.015, 0.13, 0.16), col, 0.28 + 0.72 * lines);
  float alpha = (lines * 0.42 + halo * 0.42 + center * 0.20) * uOpacity;
  gl_FragColor = vec4(col, alpha);
}

/* GPU ripple simulation ------------------------------------------------ */
const rippleSlots = [];

/* Palm shadow ---------------------------------------------------------- */
const palmCanvas = document.createElement("canvas");

palmCanvas.height = 520;

const frondAngles = [-2.92, -2.38, -1.82, -1.18, -0.44, 0.24, 0.88, 1.52, 2.12, 2.72];
function drawPalmShadow(time) {
  const w = palmCanvas.width;

/* ------------------------------------------------------------------ *
 * Small helpers and shared textures
 * ------------------------------------------------------------------ */

function makeShadowTexture() {
  const c = document.createElement("canvas");

  c.height = 128;

  grad.addColorStop(0.45, "rgba(0,0,0,.42)");

  g.beginPath();
  g.arc(64, 64, 62, 0, TAU);

  const tex = new T.CanvasTexture(c);
  tex.minFilter = T.LinearFilter;
  tex.magFilter = T.LinearFilter;
  return tex;
}
const shadowTexture = makeShadowTexture();

function makeBrainTexture() {
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#ead8bd";
  g.fillRect(0, 0, 256, 256);

  for (let row = 0; row < 18; row++) {
    g.lineWidth = 1.5 + (row % 3) * 0.7;

    for (let x = -10; x <= 266; x += 4) {
      const y = row * 15 + Math.sin(x * 0.065 + row * 0.9) * 5 + Math.sin(x * 0.021 + row * 2.2) * 4;
      if (x === -10) g.moveTo(x, y); else g.lineTo(x, y);

    g.stroke();
  }
  g.strokeStyle = "rgba(72,48,32,.5)";
  for (let col = 0; col < 15; col++) {
    g.lineWidth = 1.2;
    g.beginPath();
    for (let y = -10; y <= 266; y += 4) {
      const x = col * 19 + Math.sin(y * 0.055 + col * 1.1) * 5;
      if (y === -10) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }
  const tex = new T.CanvasTexture(c);
  tex.wrapS = T.RepeatWrapping;
  tex.wrapT = T.RepeatWrapping;
  tex.minFilter = T.LinearFilter;
  tex.magFilter = T.LinearFilter;
  return tex;
}
const brainTexture = makeBrainTexture();

function addContactShadow(x, z, sx, sz, opacity, parent) {
  const mat = new T.MeshBasicMaterial({
    map: shadowTexture,
    transparent: true,

  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, -0.695, z);
  mesh.renderOrder = 1;
  (parent || worldScene).add(mesh);

}

function screenToWorld(px, py) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  return {
    x: CAM_LEFT + (px / w) * viewWidth,
    z: topZ + (py / h) * (bottomZ - topZ),
  };
}
function worldToScreen(x, z) {
  return {
    x: ((x - CAM_LEFT) / viewWidth) * window.innerWidth,
    y: ((z - topZ) / (bottomZ - topZ)) * window.innerHeight,
  };
}
function shoreDistance(x, z) {
  const dx = x - shoreCenter.x;
  const dz = z - shoreCenter.y;
  const ang = Math.atan2(dz, dx);
  const r = Math.hypot(dx, dz * 0.94);
  const radius = shoreUniforms.uShoreRadius.value;
  const wobble = 0.22 * Math.sin(ang * 5 + 0.8) + 0.12 * Math.sin(ang * 9 - 1.3) + 0.06 * Math.sin(ang * 15 + 2.2);
  return r - (radius + wobble);
}
function isWater(x, z) {
  return shoreDistance(x, z) > 0.3;
}
function randomWaterPoint(margin, zMin, zMax) {
  const lo = CAM_LEFT + (margin == null ? 1.6 : margin);
  const hi = viewRight - (margin == null ? 1.6 : margin);
  const a = zMin == null ? -7.6 : zMin;
  const b = zMax == null ? 7.8 : zMax;
  for (let i = 0; i < 120; i++) {
    const x = rr(lo, hi);
    const z = rr(a, b);
    if (shoreDistance(x, z) > 2.1) return { x: x, z: z };
  }
  return { x: 2.5, z: 2.5 };
}
function nearestWater(x, z) {
  if (shoreDistance(x, z) > 0.8) return { x: x, z: z };
  const dx = x - shoreCenter.x;
  const dz = z - shoreCenter.y;
  const len = Math.hypot(dx, dz) || 1;
  let px = x;
  let pz = z;
  for (let i = 0; i < 30; i++) {
    px += (dx / len) * 0.35;
    pz += (dz / len) * 0.35;
    if (shoreDistance(px, pz) > 0.9) break;
  }
  return { x: px, z: pz };
}

/* ------------------------------------------------------------------ *
 * Baked seabed: grass, coral heads, rubble, small reef life
 * ------------------------------------------------------------------ */

function makeSeagrassGeometry() {
  const positions = [];
  const colors = [];
  const indices = [];
  let base = 0;
  const blades = 11;
  for (let b = 0; b < blades; b++) {
    const angle = (b / blades) * TAU + rr(-0.45, 0.45);
    const length = rr(0.16, 0.43);
    const bend = rr(-0.2, 0.25);
    const segs = 5;
    const width = rr(0.012, 0.030);
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const r = t * length;
      const x = Math.cos(angle) * r + Math.sin(t * 3.2 + b) * 0.035 * t;
      const z = Math.sin(angle) * r + Math.cos(t * 2.4 + b) * 0.025 * t;
      const y = 0.012 + Math.sin(t * Math.PI) * 0.12 + t * 0.06;
      const px = -Math.sin(angle) * width * (1 - t * 0.82);
      const pz = Math.cos(angle) * width * (1 - t * 0.82);
      positions.push(x + px, y, z + pz);
      positions.push(x - px, y, z - pz);
      const dark = [0.09, 0.18, 0.11];
      const light = [0.31, 0.48, 0.23];
      for (let side = 0; side < 2; side++) {
        colors.push(
          lerp(dark[0], light[0], t),
          lerp(dark[1], light[1], t),
          lerp(dark[2], light[2], t)
        );
      }
    }
    for (let i = 0; i < segs; i++) {
      const a = base + i * 2;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    base += (segs + 1) * 2;
  }
  const geo = new T.BufferGeometry();
  geo.setAttribute("position", new T.Float32BufferAttribute(positions, 3));
  geo.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  return geo;
}

function standardMaterial(color, roughness, metalness) {

    metalness: metalness == null ? 0 : metalness,
    flatShading: true,

function addBranchCoral(x, z, scale, color) {
  const group = new T.Group();
  const mat = standardMaterial(color, 0.75);
  const n = 8;
  for (let i = 0; i < n; i++) {
    const length = rr(0.26, 0.68) * scale;
    const radius = rr(0.034, 0.062) * scale;
    const geo = new T.CylinderGeometry(radius * 0.48, radius, length, 5, 1);
    const mesh = new T.Mesh(geo, mat);
    const a = (i / n) * TAU + rr(-0.3, 0.3);
    const tilt = rr(0.35, 1.0);
    mesh.position.set(Math.cos(a) * 0.11 * scale, length * 0.42, Math.sin(a) * 0.11 * scale);
    mesh.rotation.z = Math.cos(a) * tilt;
    mesh.rotation.x = Math.sin(a) * tilt;
    group.add(mesh);
    const tip = new T.Mesh(new T.SphereGeometry(radius * 0.8, 5, 3), mat);
    tip.position.set(
      Math.cos(a) * length * 0.54 * Math.sin(tilt) * 0.6,
      length * 0.82,
      Math.sin(a) * length * 0.54 * Math.sin(tilt) * 0.6
    );
    group.add(tip);
  }
  group.position.set(x, -0.78, z);
  worldScene.add(group);
  addContactShadow(x, z, scale * 1.4, scale * 1.2, 0.24);
  return group;
}

function makeBrainDomeGeometry(radius, height) {
  const rings = 9;
  const segs = 44;
  const positions = [0, height, 0];
  const uvs = [0.5, 0.5];
  const indices = [];
  for (let r = 1; r <= rings; r++) {
    const t = r / rings;
    for (let j = 0; j < segs; j++) {
      const a = (j / segs) * TAU;
      const ripple = Math.sin(a * 7 + t * 9) * 0.014 * t * (1 - t);
      const rad = radius * t;
      positions.push(Math.cos(a) * rad, height * (1 - t * t) + ripple, Math.sin(a) * rad);
      uvs.push(Math.cos(a) * t * 0.5 + 0.5, Math.sin(a) * t * 0.5 + 0.5);
    }
  }
  for (let j = 0; j < segs; j++) {
    const current = 1 + j;
    const next = 1 + ((j + 1) % segs);
    indices.push(0, current, next);
  }
  for (let r = 1; r < rings; r++) {
    const a0 = 1 + (r - 1) * segs;
    const b0 = 1 + r * segs;
    for (let j = 0; j < segs; j++) {
      const jn = (j + 1) % segs;
      indices.push(a0 + j, b0 + j, a0 + jn);
      indices.push(a0 + jn, b0 + j, b0 + jn);
    }
  }
  const geo = new T.BufferGeometry();
  geo.setAttribute("position", new T.Float32BufferAttribute(positions, 3));
  geo.setAttribute("uv", new T.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function makeStarGeometry(radius, inner, points) {
  const shape = new T.Shape();
  for (let i = 0; i < points * 2; i++) {
    const a = (i / (points * 2)) * TAU + Math.PI / 2;
    const r = i % 2 === 0 ? radius : inner;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  shape.closePath();
  return new T.ShapeGeometry(shape, 8);
}

function createRayGeometry(def, shape) {
  const curve = new T.CatmullRomCurve3(shape.map((v) => new T.Vector3(v[0], 0, v[1])), true, "catmullrom", 0.3);
  const outline = curve.getPoints(72);
  outline.pop();
  const N = outline.length;
  const levels = [0.12, 0.28, 0.47, 0.66, 0.83, 0.94, 1.0];
  const positions = [];
  const uvs = [];
  const sides = [];
  const indices = [];

  for (let sheet = 0; sheet < 2; sheet++) {
    const y = sheet === 0 ? 0.022 : -0.022;
    const side = sheet === 0 ? 1 : -1;
    const base = positions.length / 3;
    positions.push(0, y, 0);
    uvs.push(0.5, 0.5);
    sides.push(side);
    for (let r = 0; r < levels.length; r++) {
      for (let i = 0; i < N; i++) {
        const p = outline[i];
        positions.push(p.x * levels[r] * def.span, y, p.z * levels[r] * def.len);
        uvs.push(0.5 + (p.x * levels[r]) * 0.5, 0.5 + (p.z * levels[r]) * 0.5);
        sides.push(side);
      }
    }
    for (let i = 0; i < N; i++) {
      const a = base + 1 + i;
      const b = base + 1 + ((i + 1) % N);
      indices.push(base, a, b);
    }
    for (let r = 0; r < levels.length - 1; r++) {
      for (let i = 0; i < N; i++) {
        const a = base + 1 + r * N + i;
        const b = base + 1 + r * N + ((i + 1) % N);
        const c = base + 1 + (r + 1) * N + i;
        const d = base + 1 + (r + 1) * N + ((i + 1) % N);
        indices.push(a, c, b, b, c, d);
      }
    }
  }

  const geo = new T.BufferGeometry();
  geo.setAttribute("position", new T.Float32BufferAttribute(positions, 3));
  geo.setAttribute("uv", new T.Float32BufferAttribute(uvs, 2));
  geo.setAttribute("aSide", new T.Float32BufferAttribute(sides, 1));
  geo.setIndex(indices);
  return geo;
}

function createRayMaterial(def, phase) {
  return new T.ShaderMaterial({
    uniforms: {
      uSpan: { value: def.span },
      uLen: { value: def.len },
      uTime: { value: 0 },
      uPhase: { value: phase },
      uFlap: { value: def.flap },
      uMode: { value: def.mode },
    },
    vertexShader: glsl("ray-vert"),
    fragmentShader: fragmentShader("ray-frag", true, false),
    defines: { SPECIES: def.index },
    side: T.DoubleSide,
  });
}

function createTail(def, phase) {
  const segs = 15;
  const length = def.tail;
  const positions = new Float32Array((segs + 1) * 2 * 3);
  const colors = new Float32Array((segs + 1) * 2 * 3);
  const indices = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const w = 0.034 * (1 - t * 0.9) + 0.003;
    positions[i * 6] = -w;
    positions[i * 6 + 1] = 0.022;
    positions[i * 6 + 2] = 0.44 + t * length;
    positions[i * 6 + 3] = w;
    positions[i * 6 + 4] = 0.022;
    positions[i * 6 + 5] = 0.44 + t * length;
    let c;
    if (def.index === 2) {
      c = Math.floor(t * 17) % 2 === 0 ? [0.09, 0.12, 0.12] : [0.82, 0.72, 0.52];
    } else if (def.index === 1) {
      c = [0.035, 0.055, 0.052];
    } else {
      c = [0.02, 0.035, 0.04];
    }
    for (let side = 0; side < 2; side++) {
      colors[i * 6 + side * 3] = c[0];
      colors[i * 6 + side * 3 + 1] = c[1];
      colors[i * 6 + side * 3 + 2] = c[2];
    }
    if (i < segs) {
      const a = i * 2;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const geo = new T.BufferGeometry();
  geo.setAttribute("position", new T.BufferAttribute(positions, 3));
  geo.setAttribute("color", new T.BufferAttribute(colors, 3));
  geo.setIndex(indices);
  const mat = new T.MeshBasicMaterial({ vertexColors: true, side: T.DoubleSide });
  const mesh = new T.Mesh(geo, mat);
  mesh.userData.phase = phase;
  mesh.userData.length = length;
  mesh.userData.segs = segs;
  return mesh;
}

function updateTail(mesh, time, speed, phase) {
  const segs = mesh.userData.segs;
  const length = mesh.userData.length;
  const pos = mesh.geometry.attributes.position;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const sway = Math.sin(time * (2.4 + speed * 0.8) - i * 0.56 + phase) * 0.065 * t * (1 + speed * 0.4);
    const z = 0.44 + t * length;
    const w = 0.034 * (1 - t * 0.9) + 0.003;
    pos.setXYZ(i * 2, sway - w, 0.02, z);
    pos.setXYZ(i * 2 + 1, sway + w, 0.02, z);
  }
  pos.needsUpdate = true;
  mesh.geometry.computeBoundingSphere();
}

const rayGeometryCache = {};
function createRayVisual(def, phase, preview) {
  const root = new T.Group();
  const bank = new T.Group();
  root.add(bank);
  const geo = rayGeometryCache[def.index] || (rayGeometryCache[def.index] = createRayGeometry(def, rayOutlines[def.index]));
  const material = createRayMaterial(def, phase);
  const body = new T.Mesh(geo, material);
  bank.add(body);
  const tail = createTail(def, phase);
  bank.add(tail);
  if (def.index === 0) {
    const finGeo = new T.ConeGeometry(0.052, 0.3, 6);
    finGeo.rotateX(-Math.PI / 2);
    const finMat = new T.MeshBasicMaterial({ color: 0x071315 });
    for (let side = -1; side <= 1; side += 2) {
      const fin = new T.Mesh(finGeo, finMat);
      fin.position.set(side * 0.2, 0.025, -0.62);
      fin.rotation.z = side * -0.28;
      bank.add(fin);
    }
  }
  root.scale.setScalar(def.bodyScale);
  return { root: root, bank: bank, body: body, tail: tail, material: material };
}

    breach: null,
    resting: def.index === 2 && opts.resting !== false,
    spawn: opts.spawn === false ? 1 : 0.01,
    age: 0,
    wakeTimer: rr(0, 0.5),
    wanderTimer: rr(0, 4),
    scale: 1,
    idlePulse: rr(0, TAU),
  };
  ray.target = randomWaterPoint(2, -7.5, 7.4);
  rays.push(ray);
  return ray;
}

function createJelly(def, x, z, options) {
  const opts = options || {};
  const root = new T.Group();
  const bell = new T.Mesh(createBellGeometry(def), createJellyMaterial(def));
  bell.renderOrder = 3;
  root.add(bell);
  const tentacles = createTentacleMesh(def);
  tentacles.renderOrder = 2;
  root.add(tentacles);
  worldScene.add(root);
  const shadow = addContactShadow(x, z, 1.2, 1.0, 0.18);
  const jelly = {
    kind: "jelly",
    def: def,
    root: root,
    bell: bell,
    tentacles: tentacles,
    shadow: shadow,
    x: x,
    z: z,
    y: 0.9,
    heading: rr(0, TAU),
    vx: 0,
    vz: 0,
    phase: rr(0, TAU),
    spawn: opts.spawn === false ? 1 : 0.01,
    age: 0,
    scale: 1,
    pulse: rr(0, 1),
    startle: 0,
    mouth: 0,
  };
  jellies.push(jelly);
  return jelly;
}


/* ------------------------------------------------------------------ *
 * Jellyfish: translucent bell, pulsing, mouth arms and trailing ribbons
 * ------------------------------------------------------------------ */

const bellGeometryCache = {};
function createBellGeometry(def) {
  if (bellGeometryCache[def.id]) return bellGeometryCache[def.id];
  const points = [];
  const r = def.radius;
  const h = def.height;
  for (let i = 0; i <= 18; i++) {
    const t = i / 18;
    const radius = Math.pow(Math.sin((t * Math.PI) / 2), 0.86) * r * (1 + 0.052 * Math.sin(t * Math.PI));
    const y = Math.cos((t * Math.PI) / 2) * h;
    points.push(new T.Vector2(Math.max(0.003, radius), y));
  }
  points.push(new T.Vector2(r * 1.015, -0.022));
  const geometry = new T.LatheGeometry(points, 48);
  bellGeometryCache[def.id] = geometry;
  return geometry;
}

function createJellyMaterial(def) {
  return new T.ShaderMaterial({
    uniforms: {
      uRadius: { value: def.radius },
      uTime: { value: 0 },
    },
    vertexShader: glsl("jelly-vert"),
    fragmentShader: fragmentShader("jelly-frag", false, false),
    defines: { SPECIES: def.index },
    transparent: true,
    depthWrite: false,
    side: T.DoubleSide,
    blending: T.NormalBlending,
  });
}

function createTentacleMesh(def) {
  const parts = [];
  const positions = [];
  const colors = [];
  const indices = [];
  let base = 0;
  const tentacleColorA = def.index === 0 ? [0.47, 0.80, 0.80] : [0.48, 0.22, 0.15];
  const tentacleColorB = def.index === 0 ? [0.90, 0.99, 0.94] : [0.80, 0.51, 0.28];
  const oralColorA = [0.88, 0.72, 0.49];
  const oralColorB = [0.99, 0.92, 0.73];

  for (let i = 0; i < def.tentacles; i++) {
    const angle = (i / def.tentacles) * TAU + (def.index === 0 ? 0.08 : 0.2);
    const length = def.tentacleLength * (def.index === 0 ? rr(0.75, 1.2) : rr(0.72, 1.12));
    const segs = def.segments;
    const width = def.tentacleWidth * (def.index === 0 ? rr(0.8, 1.2) : rr(0.7, 1.3));
    const part = {
      angle: angle, radius: def.radius * 0.94, length: length, segs: segs,
      width: width, oral: false, base: base, phase: rr(0, TAU), drop: def.index === 0 ? 0.22 : 0.64,
    };
    parts.push(part);
    for (let k = 0; k <= segs; k++) {
      const t = k / segs;
      for (let s = 0; s < 2; s++) {
        positions.push(0, 0, 0);
        colors.push(
          lerp(tentacleColorA[0], tentacleColorB[0], t),
          lerp(tentacleColorA[1], tentacleColorB[1], t),
          lerp(tentacleColorA[2], tentacleColorB[2], t)
        );
      }
      if (k < segs) {
        const a = base + k * 2;
        indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      }
    }
    base += (segs + 1) * 2;
  }

  for (let i = 0; i < def.oral; i++) {
    const angle = (i / def.oral) * TAU + Math.PI / 4;
    const length = rr(0.75, 1.04);
    const segs = 10;
    const width = rr(0.075, 0.12);
    const part = {
      angle: angle, radius: def.radius * 0.50, length: length, segs: segs,
      width: width, oral: true, base: base, phase: rr(0, TAU), drop: 0.38,
    };
    parts.push(part);
    for (let k = 0; k <= segs; k++) {
      const t = k / segs;
      for (let s = 0; s < 2; s++) {
        positions.push(0, 0, 0);
        colors.push(
          lerp(oralColorA[0], oralColorB[0], t),
          lerp(oralColorA[1], oralColorB[1], t),
          lerp(oralColorA[2], oralColorB[2], t)
        );
      }
      if (k < segs) {
        const a = base + k * 2;
        indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      }
    }
    base += (segs + 1) * 2;
  }

  const geo = new T.BufferGeometry();
  geo.setAttribute("position", new T.Float32BufferAttribute(positions, 3));
  geo.setAttribute("color", new T.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  const mat = new T.MeshBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: def.index === 0 ? 0.68 : 0.64,
    depthWrite: false,
    side: T.DoubleSide,
    blending: T.NormalBlending,
  });
  const mesh = new T.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.userData.parts = parts;
  return mesh;
}

function updateTentacles(jelly, time, held) {
  const mesh = jelly.tentacles;
  const parts = mesh.userData.parts;
  const pos = mesh.geometry.attributes.position;
  const speed = Math.hypot(jelly.vx || 0, jelly.vz || 0);
  const trailX = -(jelly.vx || 0) * 0.22;
  const trailZ = -(jelly.vz || 0) * 0.22;

  for (let p = 0; p < parts.length; p++) {
    const part = parts[p];
    const radius = part.radius;
    const baseAngle = part.angle + Math.sin(time * 0.37 + part.phase) * 0.05;
    const bx = Math.cos(baseAngle) * radius;
    const bz = Math.sin(baseAngle) * radius;
    let dx = Math.cos(baseAngle) + trailX;
    let dz = Math.sin(baseAngle) + trailZ;
    const len = Math.hypot(dx, dz) || 1;
    dx /= len;
    dz /= len;
    const px = -dz;
    const pz = dx;
    const segs = part.segs;
    const length = part.length * (held ? 1.15 : 1);
    for (let k = 0; k <= segs; k++) {
      const t = k / segs;
      const wave = Math.sin(time * (part.oral ? 1.6 : 2.2) + t * 4.4 + part.phase + part.angle) * (0.035 + t * 0.12) * (part.oral ? 1.9 : 1);
      const wave2 = Math.cos(time * 1.4 + t * 7.0 + part.phase) * (part.oral ? 0.03 : 0.018);
      let x = bx + dx * length * t + px * (wave + wave2);
      let z = bz + dz * length * t + pz * (wave + wave2);
      let y = -0.018 - t * part.drop;
      if (held) {
        x = bx * (1 - t * 0.58) + px * wave * 0.8;
        z = bz * (1 - t * 0.58) + pz * wave * 0.8;
        y = -t * (part.oral ? 1.2 : 1.7) + Math.sin(time * 2 + t * 5 + part.phase) * 0.03;
      }
      const w = part.width * (1 - t * 0.68) * (part.oral ? 1 + 0.5 * Math.sin(t * 9 + time) : 1);
      const idx = (part.base + k * 2) * 3;
      pos.array[idx] = x;
      pos.array[idx + 1] = y;
      pos.array[idx + 2] = z;
      pos.array[idx + 3] = x + px * w * 2;
      pos.array[idx + 4] = y;
      pos.array[idx + 5] = z + pz * w * 2;
    }
  }
  pos.needsUpdate = true;
}

/* ------------------------------------------------------------------ *
 * Particles, splash rings and surface effects
 * ------------------------------------------------------------------ */

function makeParticleField(scene, count, blending) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const alpha = new Float32Array(count);
  const size = new Float32Array(count);
  const velocities = new Float32Array(count * 3);
  const life = new Float32Array(count);
  const maxLife = new Float32Array(count);
  const active = new Uint8Array(count);
  for (let i = 0; i < count; i++) {
    positions[i * 3 + 1] = -999;
    colors[i * 3] = 1;
    colors[i * 3 + 1] = 1;
    colors[i * 3 + 2] = 1;
    size[i] = 3;
  }
  const geo = new T.BufferGeometry();
  geo.setAttribute("position", new T.BufferAttribute(positions, 3));
  geo.setAttribute("aColor", new T.BufferAttribute(colors, 3));
  geo.setAttribute("aAlpha", new T.BufferAttribute(alpha, 1));
  geo.setAttribute("aSize", new T.BufferAttribute(size, 1));
  const mat = new T.ShaderMaterial({
    uniforms: { uPixelRatio: { value: state.dpr } },
    vertexShader: glsl("particle-vert"),
    fragmentShader: fragmentShader("particle-frag", false, false),
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: blending == null ? T.NormalBlending : blending,
  });
  const mesh = new T.Points(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 8;
  scene.add(mesh);
  const field = {
    mesh: mesh, geo: geo, mat: mat, count: count, cursor: 0,
    positions: positions, colors: colors, alpha: alpha, size: size,
    velocities: velocities, life: life, maxLife: maxLife, active: active,
    gravity: 5.8, drag: 0.6,
    spawn: function (x, y, z, opts) {
      const i = this.cursor % this.count;
      this.cursor++;
      const o = opts || {};
      const p3 = i * 3;
      this.positions[p3] = x;
      this.positions[p3 + 1] = y;
      this.positions[p3 + 2] = z;
      this.velocities[p3] = o.vx == null ? rr(-1, 1) : o.vx;
      this.velocities[p3 + 1] = o.vy == null ? rr(1, 3) : o.vy;
      this.velocities[p3 + 2] = o.vz == null ? rr(-1, 1) : o.vz;
      this.life[i] = o.life == null ? rr(0.6, 1.2) : o.life;
      this.maxLife[i] = this.life[i];
      this.size[i] = o.size == null ? rr(2, 5) : o.size;
      this.active[i] = 1;
      const c = o.color || [0.88, 0.99, 0.95];
      this.colors[p3] = c[0];
      this.colors[p3 + 1] = c[1];
      this.colors[p3 + 2] = c[2];
      this.alpha[i] = o.alpha == null ? 1 : o.alpha;
    },
    update: function (dt) {
      for (let i = 0; i < this.count; i++) {
        if (!this.active[i]) continue;
        this.life[i] -= dt;
        if (this.life[i] <= 0) {
          this.active[i] = 0;
          this.alpha[i] = 0;
          this.positions[i * 3 + 1] = -999;
          continue;
        }
        const p3 = i * 3;
        this.velocities[p3 + 1] -= this.gravity * dt;
        this.velocities[p3] *= Math.exp(-this.drag * dt);
        this.velocities[p3 + 2] *= Math.exp(-this.drag * dt);
        this.positions[p3] += this.velocities[p3] * dt;
        this.positions[p3 + 1] += this.velocities[p3 + 1] * dt;
        this.positions[p3 + 2] += this.velocities[p3 + 2] * dt;
        this.alpha[i] = clamp(this.life[i] / Math.max(this.maxLife[i], 0.001), 0, 1);
        if (this.positions[p3 + 1] < -1.0) {
          this.active[i] = 0;
          this.alpha[i] = 0;
          this.positions[p3 + 1] = -999;
        }
      }
      this.geo.attributes.position.needsUpdate = true;
      this.geo.attributes.aAlpha.needsUpdate = true;
      this.geo.attributes.aColor.needsUpdate = true;
      this.geo.attributes.aSize.needsUpdate = true;
    },
  };
  return field;
}

const splashParticles = makeParticleField(overlayScene, 520, T.NormalBlending);
const siltParticles = makeParticleField(worldScene, 180, T.NormalBlending);

function spawnSplash(x, z, strength) {
  const s = strength == null ? 1 : strength;

  for (let i = 0; i < count; i++) {

    splashParticles.spawn(x, 0.03, z, {
      vx: Math.cos(a) * speed,

      color: i % 5 === 0 ? [0.66, 0.94, 0.91] : [0.96, 1.0, 0.94],
    });

  spawnRing(x, z, 1.35 + s * 1.15, 0.84, 0, 0xd9fff2);

}

function spawnSilt(x, z) {

    siltParticles.spawn(x + Math.cos(a) * r, -0.62, z + Math.sin(a) * r, {

const rings = [];
function initRingPool() {
  const geo = new T.RingGeometry(0.82, 1.0, 56);
  for (let i = 0; i < 52; i++) {
    const mat = new T.MeshBasicMaterial({
      color: 0xd9fff2, transparent: true, opacity: 0, depthWrite: false,
      blending: T.AdditiveBlending, side: T.DoubleSide,
    });
    const mesh = new T.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = 0.055;
    mesh.visible = false;
    mesh.renderOrder = 6;
    overlayScene.add(mesh);
    rings.push({ mesh: mesh, life: 0, maxLife: 1, size: 1, delay: 0, waiting: false, opacity: 1 });
  }
}
initRingPool();
function spawnRing(x, z, size, opacity, delay, color) {
  let free = null;
  for (let i = 0; i < rings.length; i++) {
    if (!rings[i].mesh.visible) { free = rings[i]; break; }
  }
  if (!free) free = rings[0];
  free.mesh.position.set(x, 0.055, z);
  free.mesh.visible = false;
  free.mesh.scale.setScalar(0.22);
  free.mesh.material.opacity = 0;
  free.mesh.material.color.setHex(color == null ? 0xd9fff2 : color);
  free.size = size;
  free.opacity = opacity;
  free.delay = delay;
  free.life = 0;
  free.maxLife = 1.25;
  free.waiting = delay > 0;
}
function updateRings(dt) {
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    if (r.waiting) {
      r.delay -= dt;
      if (r.delay <= 0) {
        r.waiting = false;
        r.mesh.visible = true;
      } else continue;
    }
    if (!r.mesh.visible) continue;
    r.life += dt;
    const t = clamp(r.life / r.maxLife, 0, 1);
    const scale = 0.16 + t * 1.9;
    r.mesh.scale.setScalar(scale * r.size);
    r.mesh.material.opacity = Math.pow(1 - t, 1.5) * r.opacity;
    if (t >= 1) {
      r.mesh.visible = false;
      r.mesh.material.opacity = 0;
    }
  }
}

/* ------------------------------------------------------------------ *
 * Synthesized surf, splashes and plinks
 * ------------------------------------------------------------------ */
const audio = {
  ctx: null,
  master: null,
  surf: null,
  surfGain: null,
  surfFilter: null,
  enabled: false,
  failed: false,
  init: function () {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.failed = true; return; }
    const ctx = new AC();
    this.ctx = ctx;
    const master = ctx.createGain();
    master.gain.value = 0.62;
    master.connect(ctx.destination);
    this.master = master;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < data.length; i++) {
      last = last * 0.985 + (Math.random() * 2 - 1) * 0.12;
      data[i] = last;
    }
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 620;
    filter.Q.value = 0.62;
    const gain = ctx.createGain();
    gain.gain.value = 0;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    source.start();
    this.surf = source;
    this.surfGain = gain;
    this.surfFilter = filter;
  },
  setEnabled: function (on) {
    if (on) this.init();
    this.enabled = on && !this.failed;
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  update: function (swash, calm, rain) {
    if (!this.ctx || !this.surfGain) return;
    const now = this.ctx.currentTime;
    const target = this.enabled ? 0.055 + swash * 0.105 + rain * 0.012 : 0;
    this.surfGain.gain.setTargetAtTime(target, now, 0.18);
    this.surfFilter.frequency.setTargetAtTime(this.enabled ? 460 + swash * 740 - calm * 90 : 300, now, 0.25);
  },
  burst: function (intensity) {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const s = intensity == null ? 1 : intensity;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.8, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < data.length; i++) {
      last = last * 0.92 + (Math.random() * 2 - 1) * 0.42;
      data[i] = last * Math.exp(-i / (ctx.sampleRate * 0.22));
    }
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 620 + s * 300;
    filter.Q.value = 0.8;
    const gain = ctx.createGain();
    gain.gain.value = 0.0;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);
    const t = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.26 * s, t + 0.018);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.55 + s * 0.25);
    source.start(t);
    source.stop(t + 0.9 + s * 0.25);
  },
  plink: function (pitch) {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    const t = ctx.currentTime;
    const f = pitch == null ? 980 : pitch;
    osc.frequency.setValueAtTime(f, t);
    osc.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.16);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.026, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(t);
    osc.stop(t + 0.24);
  },
  drip: function () {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    const t = ctx.currentTime;
    osc.frequency.setValueAtTime(1450, t);
    osc.frequency.exponentialRampToValueAtTime(720, t + 0.09);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.012, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(t);
    osc.stop(t + 0.12);
  },
};
